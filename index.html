        [63,4,"Second Great Awakening (c. 1790–1840s) [Period 4]","Protestant revival emphasizing human perfectibility, free will, and moral reform. Charles Finney led revivals in 'Burned‑Over District' of western New York. Inspired temperance, abolitionism, women's rights, prison reform, public education.","Reaction against Enlightenment rationalism and deism; anxiety over rapid social changes (Market Revolution, immigration).","Inspired reform movements: temperance (American Temperance Society, 1826); abolitionism (Garrison, Douglass); women's rights (Seneca Falls, 1848); education (Horace Mann); mental health (Dorothea Dix).","Continuity – Religious revivals before (First Great Awakening). Change – Focused on social reform – making society perfect, not just saving souls.","Second Great Awakening vs. First Great Awakening. First focused on individual salvation; Second focused on moral and social reform."],
        [64,4,"Missouri Compromise (1820) [Period 4]","Congressional agreement: Missouri admitted as slave state, Maine as free state (to keep Senate balance). Established 36°30' line – slavery prohibited north of that line in Louisiana Territory (except Missouri).","Missouri applied as slave state, which would tip Senate balance. Northern congressmen refused without a free state paired.","Temporarily resolved sectional conflict – lasted 34 years. Postponed Civil War. Set precedent that Congress could limit slavery geographically.","Continuity – Sectional balance maintained until 1850. Change – First time Congress drew a line across continent to separate free and slave territory.","Missouri Compromise vs. Compromise of 1850. Missouri set a line; 1850 used popular sovereignty."],
        [65,4,"Monroe Doctrine (1823)","President Monroe declared Western Hemisphere closed to European colonization. Warned European powers not to interfere in newly independent Latin American republics. Promised U.S. would not interfere in European affairs.","Fear that 'Holy Alliance' (Russia, Prussia, Austria) would help Spain reconquer Latin American colonies. U.S. wanted to protect southern flank.","Became cornerstone of U.S. foreign policy for over 200 years. Initially enforced by British Royal Navy. Later expanded by Roosevelt Corollary (1904).","Continuity – U.S. continued to assert hemispheric dominance. Change – In 1823, U.S. was weak; doctrine was mostly bluster. Later could enforce it alone.","Monroe Doctrine vs. Roosevelt Corollary (1904). Monroe defensive; Roosevelt aggressive and interventionist."],
        [66,4,"Expansion of Democracy (1820s)","Elimination of property qualifications for voting for white men. By 1820s, most states removed land/property requirements. Expanded electorate dramatically, especially in West and among urban workers.","Jacksonian democracy – belief that ordinary white men should vote; frontier states set example; Panic of 1819 led to foreclosures, linking voting rights to military service and taxes.","Andrew Jackson elected 1828 as 'Common Man' president. Rise of Second Party System (Democrats vs. Whigs) with mass‑based parties. Voter turnout soared (80%+).","Continuity – Voting remained restricted to men for another 100 years (19th Amendment, 1920). Change – Shift from elite democracy to mass democracy for white men.","Expansion of democracy (1820s) vs. 15th Amendment (1870) vs. 19th Amendment (1920). 1820s applied only to white men; 15th gave Black men the vote (systematically denied); 19th gave women the vote."],
        [67,4,"Jackson's Presidency (1829–1837)","Andrew Jackson, first 'Common Man' president. Used spoils system ('rotation in office'), relied on informal kitchen cabinet, used veto more than all previous presidents combined (12 vetoes). Embodied rise of Democratic Party and Second Party System.","Expansion of democracy; backlash against 'corrupt bargain' of 1824; Jackson's popularity as military hero (Battle of New Orleans).","Strengthened executive branch – Jackson aggressively used veto and asserted presidential authority. Modernized political parties (spoils system). His policies (Indian Removal, Bank War, Nullification Crisis) defined era.","Continuity – Strong executive presidents followed (Lincoln, T. Roosevelt, FDR). Change – Jackson used veto more than all predecessors combined; ignored Supreme Court (Worcester v. Georgia). Transformed presidency from weak office to powerful one.","Jackson vs. Jefferson. Jefferson: strict construction, reduced executive power. Jackson: expanded executive power, acted above law."],
        [68,4,"Indian Removal Act (1830)","Law signed by Andrew Jackson forcing Native Americans east of Mississippi to relocate west (present‑day Oklahoma). Trail of Tears (1838) – 16,000 Cherokee marched; about 4,000 died.","Desire for land (gold discovered in Georgia); Jackson's hostility to Natives; Southern states wanted to abolish Native governments.","Cherokee, Chickasaw, Choctaw, Creek, Seminole forcibly removed; tens of thousands died. Opened millions of acres for cotton and slavery. Set precedent for violating treaties and ignoring Court rulings.","Continuity – Indian removal continued (Dawes Act 1887). Change – Before 1830, some tribes coexisted; after, forced relocation became official policy.","Indian Removal Act vs. Dawes Act (1887). Removal forced tribes to move west; Dawes broke up tribal lands into individual plots to force assimilation."],
        [69,4,"McCulloch v. Maryland (1819)","Supreme Court case: Maryland tried to tax Baltimore branch of Second Bank of the U.S. (BUS). Court ruled (1) Bank constitutional under Necessary and Proper Clause (implied powers), (2) Maryland could not tax Bank because 'power to tax is power to destroy.'","States resented BUS; Maryland passed tax to drive it out; BUS challenged.","Established doctrine of implied powers (broad interpretation of Constitution). Affirmed federal supremacy over states. Allowed BUS to continue (until Jackson killed it).","Continuity – Marshall Court continued to expand federal power (Marbury, Gibbons). Change – McCulloch affirmed Congress has powers beyond explicit list, a departure from strict construction.","McCulloch v. Maryland vs. Gibbons v. Ogden (1824). Both expanded federal power; McCulloch dealt with implied powers and federal supremacy; Gibbons with interstate commerce."],
        [70,4,"Gibbons v. Ogden (1824)","Supreme Court case: New York granted monopoly on steamboat operation in its waters. Gibbons had federal license and operated competing steamboat. Marshall ruled that Commerce Clause gave Congress exclusive power over interstate commerce, voiding state monopolies that interfered.","Competing steamboat operators; states granting conflicting monopolies; need for uniform regulation.","Struck down state‑granted monopolies on interstate waterways. Broadened 'commerce' to include navigation. Established federal preemption over state law in interstate commerce.","Continuity – Commerce Clause remains key source of federal power. Change – Before Gibbons, states could grant monopolies affecting interstate commerce; after, only federal government could regulate commerce crossing state lines.","Gibbons v. Ogden vs. Wabash, St. Louis & Pacific Railway Co. v. Illinois (1886). Gibbons affirmed federal power; Wabash led to Interstate Commerce Act (1887)."],
        [71,4,"Erie Canal (1825)","Man‑made waterway connecting Great Lakes (Buffalo) to Hudson River (Albany). 363 miles long. Slashed shipping costs ($100 to $10 per ton of grain). Made New York City nation's commercial capital.","Need for cheap transportation of Midwestern grain to Eastern markets; rivalry with British Canadian canals; New York State funding.","Triggered canal‑building craze; tied Midwest to Northeast (economic sectionalism); made New York City nation's largest port; inspired later federal internal improvements.","Continuity – Canals continued to be built (Ohio & Erie). Change – Erie Canal was first major U.S. transportation project; showed infrastructure could transform economy.","Erie Canal vs. Transcontinental Railroad (1869). Both transformed trade; Erie for water; railroad for land."],
        [72,4,"Worcester v. Georgia (1832)","Supreme Court case: Georgia passed laws requiring white residents of Cherokee territory to swear allegiance to state. Samuel Worcester, a missionary, refused and was arrested. Court ruled Georgia's laws had no force within Cherokee territory – only federal government could deal with Cherokee. Jackson reportedly said, 'John Marshall has made his decision; now let him enforce it.'","Georgia's attempt to extend laws over Cherokee; Cherokee had constitution and treaty rights; Worcester challenged law.","Decision ignored by Jackson and Georgia; Trail of Tears proceeded. However, case established principle of tribal sovereignty within U.S. legal system, later reaffirmed.","Continuity – Federal government continued to violate treaties and sovereignty. Change – Worcester is landmark case affirming tribal sovereignty; ignored at time but became basis for later court victories.","Worcester v. Georgia vs. Cherokee Nation v. Georgia (1831). In earlier case, Court said Cherokee were not foreign nation; in Worcester, Court affirmed tribal sovereignty."],
        [73,4,"Nullification Crisis (1832–1833)","South Carolina declared Tariffs of 1828 ('Tariff of Abominations') and 1832 null and void within state. VP John C. Calhoun argued states had right to nullify federal laws. Jackson threatened force; Congress passed Force Bill. Henry Clay brokered compromise tariff (1833) lowering rates; South Carolina withdrew nullification.","Tariff of Abominations seen by Southerners as benefiting Northern manufacturers at expense of Southern cotton exporters. Calhoun argued states could nullify.","Showed federal government (under Jackson) willing to use force to maintain Union – precedent for Lincoln's response to secession. Previewed secession argument.","Continuity – States' rights arguments continued (secession 1860‑61). Change – Nullification rejected as unconstitutional. Civil War settled: states cannot nullify or secede.","Nullification Crisis vs. Secession (1860‑61). Nullification claimed states could void specific laws while remaining in Union; secession claimed states could leave entirely."],
        [74,4,"Bank War (1832–1836)","Jackson's political campaign to destroy Second Bank of the U.S. (BUS). Jackson vetoed recharter in 1832, then removed federal deposits and placed them in state 'pet banks.' BUS president Nicholas Biddle called in loans, causing financial contraction.","Jackson believed BUS was a 'monster' favoring wealthy and corrupting politicians. Biddle pushed for early recharter to make it election issue.","BUS died when charter expired in 1836. Without central bank, state banks expanded credit recklessly, fueling land speculation. Panic of 1837 followed, triggered by Jackson's Specie Circular.","Continuity – Opposition to central banking persisted until Federal Reserve (1913). Change – BUS killed; U.S. had no central bank for nearly 80 years. Jackson's veto was dramatic expansion of executive power.","Bank War vs. Hamilton's National Bank (1791). Hamilton argued bank was necessary and proper; Jackson argued unconstitutional."],
        [75,4,"American System (Henry Clay)","Economic plan: (1) Protective tariffs to fund internal improvements and protect industry; (2) National Bank (BUS) to stabilize currency; (3) Internal improvements (roads, canals, harbors). Core of Whig Party ideology.","Post‑War of 1812 nationalism; need to bind sections together; British manufactured goods dumping.","Tariffs passed but controversial (especially 'Tariff of Abominations'); internal improvements often blocked by presidential vetoes; National Bank rechartered until Jackson killed it.","Continuity – Federal support for internal improvements remained contested until Eisenhower interstate system. Change – American System became Whig platform; later Republicans (Lincoln) adopted similar policies.","American System vs. Hamilton's Financial Plan. Hamilton focused on assumption of debt, national bank, tariffs; Clay added explicit internal improvements."],
        [76,4,"Nat Turner's Rebellion (1831)","Slave rebellion in Southampton County, Virginia. Nat Turner, an enslaved preacher, led about 70 followers killing approximately 60 white men, women, and children over two days before being suppressed by state militia. Turner was captured, tried, and executed.","Brutal conditions of chattel slavery; Turner's religious vision that he was called to lead his people to freedom; growing abolitionist movement.","Southern states passed much harsher slave codes, prohibiting teaching enslaved people to read, limiting assembly, requiring white ministers at Black worship services. Terrified white Southerners; inspired Northern abolitionists.","Continuity – Slave rebellions preceded (Stono 1739, Gabriel 1800, Vesey 1822) and continued. Change – Nat Turner's rebellion was deadliest in U.S. history (white casualties). Led to most severe crackdown on enslaved people's rights.","Nat Turner vs. Denmark Vesey (1822). Vesey's rebellion discovered before it could begin; Turner's succeeded temporarily. Vesey led to stricter regulations in South Carolina; Turner's led to even harsher codes across South."],
        [77,4,"Abolitionist Movement (1830s–1860s)","Movement dedicated to ending slavery. Key figures: William Lloyd Garrison (The Liberator, 1831 – immediate, uncompensated emancipation); Frederick Douglass (North Star); Grimké sisters; Underground Railroad (Harriet Tubman).","Second Great Awakening's moral reform impulse; Enlightenment ideals; resistance from enslaved people (Nat Turner); British abolition (1833).","Southerners defended slavery as 'positive good' (Calhoun) and passed Gag Rule (1836‑1844) to table antislavery petitions. Movement deepened sectional divide, radicalized Northern public opinion, laid groundwork for Republican Party. Inspired women's rights activism.","Continuity – Anti‑slavery sentiment existed since Revolution (Quakers, early abolition societies). Change – Abolitionism shifted from gradual to immediate emancipation (Garrison). Became mass movement with moral urgency.","Abolitionists vs. Free Soilers. Abolitionists wanted to end slavery everywhere (moral). Free Soilers wanted to prevent expansion into territories (economic – preserve land for white free labor)."],
        [78,4,"Frederick Douglass (c. 1838–1895)","Former slave, abolitionist orator, writer, editor. Published Narrative of the Life of Frederick Douglass (1845) and newspaper North Star. Powerful speaker for immediate emancipation and equal rights. Supported women's suffrage.","Born into slavery; taught himself to read; escaped to North; joined abolitionist movement (Garrison initially, later broke).","One of most influential abolitionists; met with Lincoln during Civil War to advocate for Black troops and emancipation; after war held federal offices (Marshal of D.C.); continued fighting for equal rights until death.","Continuity – Black abolitionist leadership (Truth, Garnet). Change – Douglass was most photographed American of 19th century; used print media and public speaking to reach mass audiences. Shift from moral suasion to political action.","Douglass vs. Garrison. Garrison: immediate emancipation, non‑violence, moral purity; Douglass: also immediate but supported political action (voting, Constitution as anti‑slavery) and eventually violence (Civil War)."],
        [79,4,"Sojourner Truth (c. 1797–1883)","Former slave, abolitionist, women's rights activist. Famous for 'Ain't I a Woman?' speech (1851) at women's rights convention in Ohio. Born Isabella Baumfree; changed name to Sojourner Truth.","Escaped slavery with infant daughter; sued for her son's freedom (won); experienced sexism and racism within reform movements.","Became iconic figure for both abolition and women's rights; challenged notion that women were weak and needed protection. Speeches highlighted intersection of race and gender.","Continuity – Black women reformers before and after (Maria Stewart, Ida B. Wells). Change – Truth successfully sued white men for her son's freedom – rare for Black woman in 1828.","Sojourner Truth vs. Frederick Douglass. Both former slaves, powerful orators; Truth focused more on women's rights and religion; Douglass on political action. Truth illiterate but memorized Scripture; Douglass used written word."],
        [80,4,"Uncle Tom's Cabin / Harriet Beecher Stowe (1852)","Novel exposing horrors of slavery through character Uncle Tom, a kind, devout enslaved man beaten to death by cruel master. Best‑selling book of 19th century (300,000 copies first year). Lincoln reportedly called Stowe 'the little woman who wrote the book that started this great war.'","Fugitive Slave Law (1850) required Northerners to return runaways; Stowe wanted to humanize enslaved people and stir Northern conscience.","Radicalized Northern public opinion; gave abolitionism mass appeal. Southerners denounced it as propaganda. Increased sectional tension and helped mobilize Republican Party.","Continuity – Abolitionist literature existed before (The Liberator, Douglass's Narrative). Change – Uncle Tom's Cabin reached far more people than any other antislavery work. Turned abstract opposition into emotional identification with victims.","Stowe's novel vs. Douglass's Narrative. Douglass's was personal testimony, authentic; Stowe's was fiction based on true accounts. Both effective; Douglass's reached intellectuals; Stowe's reached mass market."],
        [81,4,"Market Revolution (c. 1800–1850)","Transformation from subsistence farming to commercial, capitalist, national market system. Components: Transportation Revolution (Erie Canal, National Road, steamboats, railroads); Communication Revolution (telegraph); Technology (interchangeable parts, cotton gin, steel plow, mechanical reaper); Factory system (Lowell mills).","Industrialization in Britain (technology transfer); government support (tariffs, internal improvements); growing population and transportation networks; end of War of 1812 (spurred domestic manufacturing).","Created new middle class (white‑collar workers, managers, clerks). Created laboring poor ('wage slaves' – long hours, low pay). Led to Cult of Domesticity (women in home, men in public sphere). Fueled immigration (Irish to cities, Germans to West). Shifted U.S. from local economies to national, interconnected market.","Continuity – Capitalism continued. Change – Before 1800, most Americans were self‑sufficient farmers; after 1850, most bought and sold in a market, worked for wages, connected by railroads, canals, telegraphs.","Market Revolution vs. Industrial Revolution in Britain. Both used new technologies and factories. U.S. had labor shortage (attracting immigrants); Britain had labor surplus. U.S. transportation revolution more dramatic due to vast size."],
        [82,4,"Lowell Mill Girls (1820s–1840s)","Young unmarried women from New England farms who worked in textile mills in Lowell, Massachusetts. Lived in company boarding houses, worked long hours (12‑14 hour days), experienced clock‑regulated factory discipline. Initially earned higher wages than other women (though still low) and had educational opportunities (lectures, libraries).","Market Revolution created factory jobs; farm families needed cash; New England had surplus of young women.","Early labor organizing – Lowell Female Labor Reform Association (1840s) protested wage cuts and long hours. Conditions deteriorated over time; by 1850s, Irish immigrant women replaced Yankee farm girls. Showed both opportunities and exploitation of early industrial labor.","Continuity – Women continued to work in factories (later more likely immigrants). Change – Lowell system declined because women rebelled and immigrant labor cheaper. Paternalistic oversight replaced by harsher, more exploitative conditions.","Lowell Mill Girls vs. earlier domestic system (putting‑out system). Before Lowell, women spun and wove at home – controlled own time but earned less. Lowell system brought them into factories, fixed hours away from family but earned more."],
        [83,4,"Irish Immigration (1820s–1840s)","Large‑scale migration of Irish Catholics to U.S., peaking after Great Famine (Potato Famine) of 1845‑1852. Over 1 million Irish arrived, mostly settling in Northeastern cities (Boston, New York, Philadelphia). Worked as low‑wage laborers (canals, railroads, factories, domestic service). Faced intense anti‑Catholic, anti‑Irish nativism.","Potato blight destroyed staple food of Ireland; British policies exacerbated famine; economic opportunity in U.S.","Irish became major political force in cities (e.g., Tammany Hall political machine in New York). Faced discrimination ('No Irish Need Apply') and were blamed for crime, poverty, taking jobs. Nativist backlash led to Know‑Nothing Party (1850s). Shaped Catholic Church in America.","Continuity – Immigration from Europe continued; nativism reappeared against later groups (Southern/Eastern Europeans 1890s‑1920s). Change – Irish were first large‑scale Catholic immigrant group; changed American religious demographics and faced most violent nativist backlash of 19th century.","Irish vs. German immigration (1840s‑50s). Irish: Catholic, settled in cities, low‑wage labor, faced intense nativism. Germans: many Protestant or Jewish, more skilled, moved to Midwest (farms), faced less nativism."],
        [84,4,"German Immigration (1820s–1840s)","Large‑scale migration from German states. Motives: economic hardship (crop failures, overpopulation) and political unrest (failures of 1848 revolutions, 'Forty‑Eighters'). Germans settled heavily in Midwest (Ohio, Indiana, Illinois, Wisconsin, Texas) – more likely farmers, artisans, skilled workers.","Economic hardship; political repression after failed 1848 revolutions; availability of cheap land in Midwest.","Contributed to growth of Midwestern agriculture, industry, culture (lager beer, kindergarten, Christmas tree). Many Forty‑Eighters became abolitionists and supported Republican Party. Germans faced some nativism (temperance activists disliked beer culture), but less than Irish.","Continuity – Germans remained largest immigrant group for decades; continued to shape American culture. Change – After 1848, political refugees added strongly anti‑slavery element to German settlements, making Midwest hotbed of Republicanism.","German vs. Irish immigration. Germans: more skilled, more likely to settle Midwest, less nativist backlash, more likely to oppose slavery. Irish: unskilled, urban, faced violent anti‑Catholic nativism, more likely Democrats."],
        [85,4,"Nativism / Know‑Nothing Party (1840s–1850s)","Nativism – political movement opposing immigration, especially by Catholics. American Party (Know‑Nothings) emerged 1850s, named for secretive nature ('I know nothing'). Feared immigrants (especially Irish Catholics) would corrupt elections, take jobs, undermine Protestant American culture.","Surge of Irish and German immigration 1840s‑50s; Protestant fear of Catholic influence (the Pope, parochial schools); economic competition (immigrants worked for lower wages).","Know‑Nothing Party briefly powerful mid‑1850s (winning state elections in Massachusetts, New York). Party split over slavery; most members joined Republican Party (opposed slavery expansion). Nativism persisted but never again captured major party until 1920s (second Klan).","Continuity – Nativism reappears throughout American history (Anti‑Chinese movement 1870s‑80s, Immigration Restriction League 1890s, 1924 National Origins Act). Change – Know‑Nothing Party first major anti‑immigrant political party; collapsed because slavery question trumped nativist concerns.","Know‑Nothing Party (1850s) vs. Immigration Restriction League (1890s). Know‑Nothings opposed Irish and German Catholics; League opposed Southern and Eastern Europeans (Italians, Poles, Jews) on pseudo‑scientific grounds."],
        [86,4,"Cult of Domesticity / Republican Motherhood (early 1800s)","Gender ideology assigning women to private sphere (home) and men to public sphere (work, politics). Cult of Domesticity claimed women naturally pious, pure, submissive, domestic. Republican Motherhood argued women's role to raise virtuous, educated sons for republic – giving women justification for education but still confining them to home.","Market Revolution separated work from home (men went to factories/offices; women stayed home). Revolutionary generation needed to reconcile republican ideals with women's exclusion from politics.","Limited women to domestic sphere but paradoxically elevated importance of educating women (to produce good citizens). Women used ideology to justify involvement in reform movements (temperance, abolition – morally purifying society). Barrier to women's suffrage and professional careers, but gave them moral authority to leverage.","Continuity – Gender roles remained separate spheres throughout 19th and much of 20th century. Change – Republican Motherhood shifted from colonial view (women inferior, uneducated) to view of women as morally superior but confined to home. Cult of Domesticity narrowed space further.","Cult of Domesticity vs. modern feminism. Cult argued women's place was home, morally superior but unfit for politics. Feminism argues equality and equal access to all spheres."],
        [87,4,"Dorothea Dix (1820s–1850s)","Reformer who documented horrific conditions of mentally ill (jailed with criminals, beaten, chained, ignored) and lobbied state legislatures to create separate mental asylums. Also worked for prison reform.","Second Great Awakening humanitarian impulses; Dix was teacher who visited Massachusetts jail and was shocked; spent years traveling and documenting conditions.","Led to creation of first generation of mental asylums in U.S. (over 30 state hospitals). Improved prison conditions (separate facilities for women, children, mentally ill). Dix's work laid foundation for 'medical model' of mental health.","Continuity – Reformers continued to work on mental health and prison reform. Change – Before Dix, mentally ill treated as criminals or possessed; after, seen as sick and deserving humane treatment.","Dorothea Dix vs. Horace Mann (education reform). Dix focused on mental health and prisons; Mann on public education. Both motivated by Second Great Awakening, used documentation to persuade legislatures."],
        [88,4,"Horace Mann (1830s–1840s)","'Father of American Public Education.' As secretary of Massachusetts Board of Education, Mann advocated for free, non‑sectarian, common schools educating all children regardless of class or religion. Pushed for teacher training (normal schools), longer school years, better curricula.","Belief that democracy required educated citizenry; Market Revolution needed literate workers; Second Great Awakening's reform spirit.","Massachusetts established first statewide public school system, model for other states. Normal schools (teacher training colleges) established. By Civil War, most Northern states had free public schools. Mann's ideas influenced education reform nationally.","Continuity – Public education expanded; today universal K‑12 education is norm. Change – Before Mann, education mostly private, church‑run, or non‑existent (especially for poor). After, free public schools became common.","Horace Mann vs. modern education reform. Mann created system; modern reforms (charter schools, standards, testing) build on his foundation."],
        [89,4,"Seneca Falls Convention (1848)","First women's rights convention in U.S., held in Seneca Falls, New York. Organized by Elizabeth Cady Stanton and Lucretia Mott (excluded from 1840 World Anti‑Slavery Convention). Issued Declaration of Sentiments, modeled on Declaration of Independence, listing grievances against male oppression and demanding full equality, including right to vote.","Women's experience in abolitionist movement (leaders but excluded from leadership roles and public speaking). Second Great Awakening's emphasis on moral reform and equality before God. Growing market economy led women to question exclusion.","Launched women's suffrage movement. Demand for vote controversial even among attendees (some thought too radical), but passed. Marked beginning of organized feminism in U.S. 19th Amendment (1920) gave women vote – 72 years later.","Continuity – Women's rights activism continued (Susan B. Anthony, NAWSA, National Woman's Party). Change – Seneca Falls first public demand for woman suffrage. Before, efforts focused on property laws; after, focus shifted to vote as key to all other reforms.","Seneca Falls Declaration of Sentiments vs. Declaration of Independence. Same structure: preamble (all men and women created equal), list of grievances (against 'men' instead of 'the King'), resolution demanding equality."],
        [90,4,"Manifest Destiny (1845)","Belief coined by John L. O'Sullivan (1845) that U.S. had God‑given right and duty to expand across North America from Atlantic to Pacific. Used to justify annexation of Texas, Oregon boundary compromise (49th parallel), Mexican‑American War, and forced removal of Native Americans.","American exceptionalism (America unique, virtuous nation with special mission); economic ambition (land, resources, markets); fear of European powers (Britain in Oregon, Spain/Mexico in Southwest); racial and cultural superiority (spreading democracy and 'civilization').","Texas annexation (1845); Oregon Treaty with Britain (1846); Mexican‑American War (1846‑48) and Mexican Cession; forced Indian removal (Trail of Tears, later wars). Deepened sectional tensions over whether new territories would be free or slave.","Continuity – Westward expansion had been happening since colonial era. Change – Manifest Destiny as named ideology (1845) made expansion explicit, divine mission. Justified aggressive war and dispossession as virtuous acts.","Manifest Destiny vs. earlier westward expansion. Earlier driven by land speculation, population pressure, destruction of Native resistance. Manifest Destiny added ideological and racial justification."],
        [91,4,"Texas Annexation (1845)","U.S. annexed Republic of Texas as slave state. Texas had won independence from Mexico in 1836 (Battle of San Jacinto) and existed as independent republic for nearly 10 years. Annexation delayed because Northerners feared adding large slave state and Mexico threatened war.","Texas independent but feared reconquest; Southerners wanted to expand slave territory; President John Tyler (pro‑slavery Virginian) pushed for annexation in last days of office.","Mexico broke diplomatic relations, leading directly to Mexican‑American War (1846‑48). Annexation deepened sectional tensions (adding slave state). Finalized Texas borders (claimed land north to Rio Grande, disputed by Mexico).","Continuity – U.S. continued to add slave states (Florida, 1845). Change – Texas was first independent nation annexed by U.S., and it directly caused war with Mexico. Annexation delayed nearly a decade due to fear of war and Northern opposition.","Texas Annexation vs. Louisiana Purchase (1803). Louisiana Purchase peaceful purchase from France; Texas Annexation annexed independent republic that had broken away from Mexico, provoking war."],
        [92,4,"Mexican‑American War (1846–1848)","U.S. victory; Treaty of Guadalupe Hidalgo gave Mexican Cession (present‑day CA, NV, UT, AZ, NM, CO, parts of WY, CO, and TX). U.S. paid $15 million and assumed claims of American citizens against Mexico.","Border dispute (Nueces River vs. Rio Grande); President Polk provoked Mexico by sending troops; Manifest Destiny; U.S. wanted California and Southwest.","Massive land acquisition – reignited slavery debate. Wilmot Proviso (proposed ban on slavery in all new territory) failed but became rallying cry for Free Soilers. War produced future Civil War generals (Grant, Lee, McClellan) and deepened sectional hostility. Mexico lost half its territory.","Continuity – U.S. expansion continued (Gadsden Purchase, 1853). Change – Mexican Cession brought slavery question to forefront of national politics, leading to Compromise of 1850 and eventual breakup of Union. First U.S. war fought primarily for territorial expansion.","Mexican‑American War vs. War of 1812. Both added territory or influence; Mexican War aggressive expansion; War of 1812 defensive. Mexican War intensified sectionalism; War of 1812 increased nationalism."],
        [93,4,"Wilmot Proviso (1846)","Proposed by Rep. David Wilmot (D‑PA) to ban slavery in ALL territory acquired from Mexico. Passed House twice but failed in Senate. Never became law.","Northern fear of 'Slave Power' conspiracy – that Southern planters would dominate new territories and national government; Free Soil ideology (economic, not moral – wanted land for white free labor).","Terrified the South; became rallying cry for Northern anti‑slavery forces. Set stage for Compromise of 1850. Debate over Proviso showed slavery question could not be avoided.","Continuity – Proposals to restrict slavery continued (Missouri Compromise line, popular sovereignty). Change – Wilmot Proviso would have banned slavery from all Mexican Cession land (no line, no compromise). More radical than Missouri Compromise, intensified sectional polarization.","Wilmot Proviso vs. Missouri Compromise (1820). Missouri set line (36°30'); Wilmot Proviso would have banned slavery entirely from Mexican Cession, with no geographical exception."]
    );
