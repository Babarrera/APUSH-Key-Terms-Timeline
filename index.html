    let currentGraphNodes = [];
    let currentGraphEdges = [];

    // Helper: find related card IDs (same as before)
    function findRelatedCards(sourceId, text) {
        const results = [];
        const lowerText = text.toLowerCase();
        window.cardsData.forEach(c => {
            if (c[0] === sourceId) return;
            const titleLower = c[2].toLowerCase();
            if (lowerText.includes(titleLower) ||
                (titleLower.includes('stamp act') && lowerText.includes('stamp act')) ||
                (titleLower.includes('french and indian') && lowerText.includes('french and indian')) ||
                (titleLower.includes('missouri compromise') && lowerText.includes('missouri compromise'))) {
                results.push({ id: c[0], title: c[2] });
            }
        });
        return results.slice(0, 8);
    }

    // Timeline builder
    function buildTimeline() {
        const container = document.getElementById('timelineContainer');
        if (!container) return;
        container.innerHTML = '';
        const filtered = currentPeriod === 'all' ? cardsData : cardsData.filter(c => c[1] == currentPeriod);
        if (filtered.length === 0) {
            container.innerHTML = '<div style="padding:2rem; text-align:center;">No cards in this period.</div>';
            return;
        }
        filtered.forEach(card => {
            const [id, period, title, definition, causes, effects, continuity, compare] = card;
            const periodColor = ['#e34d4c','#f39c12','#f1c40f','#2ecc71','#3498db','#9b59b6','#7f8c8d','#5d6d7e','#2c3e50'][period-1];
            const item = document.createElement('div');
            item.className = 'timeline-item';
            item.style.borderLeftColor = periodColor;
            item.id = `timeline-card-${id}`;
            item.innerHTML = `
                <div class="timeline-header">
                    <span class="timeline-title">${id}. ${title}</span>
                    <span class="period-badge">Period ${period}</span>
                </div>
                <div class="timeline-content">
                    <div><strong>⚡ Causes:</strong> <span class="relation-links" id="timeline-causes-${id}"></span></div>
                    <div><strong>🌊 Effects:</strong> <span class="relation-links" id="timeline-effects-${id}"></span></div>
                    <div><strong>🔄 Continuity & Change:</strong> <span class="relation-links" id="timeline-cont-${id}"></span></div>
                    <div><strong>⚖️ Compare & Contrast:</strong> <span class="relation-links" id="timeline-comp-${id}"></span></div>
                    <div class="full-text">
                        <p><strong>Definition:</strong> ${definition}</p>
                        <p><strong>Causes full:</strong> ${causes}</p>
                        <p><strong>Effects full:</strong> ${effects}</p>
                        <p><strong>Continuity/Change:</strong> ${continuity}</p>
                        <p><strong>Compare/Contrast:</strong> ${compare}</p>
                    </div>
                </div>
            `;
            container.appendChild(item);
            // Add links
            const addLinks = (containerId, text) => {
                const linksDiv = document.getElementById(containerId);
                if (!linksDiv) return;
                const related = findRelatedCards(id, text);
                related.forEach(rel => {
                    const link = document.createElement('a');
                    link.href = `#timeline-card-${rel.id}`;
                    link.className = 'card-link';
                    link.textContent = `${rel.id}. ${rel.title.substring(0, 50)}`;
                    link.onclick = (e) => { e.preventDefault(); document.getElementById(`timeline-card-${rel.id}`).scrollIntoView({ behavior: 'smooth' }); };
                    linksDiv.appendChild(link);
                });
            };
            addLinks(`timeline-causes-${id}`, causes);
            addLinks(`timeline-effects-${id}`, effects);
            addLinks(`timeline-cont-${id}`, continuity + ' ' + compare);
            addLinks(`timeline-comp-${id}`, compare);
            // Toggle
            const header = item.querySelector('.timeline-header');
            const content = item.querySelector('.timeline-content');
            header.addEventListener('click', () => {
                content.classList.toggle('open');
            });
        });
    }

    // Graph builder using D3 (must have d3 loaded)
    function buildGraph() {
        const container = document.getElementById('graphContainer');
        if (!container) return;
        container.innerHTML = '';
        const width = container.clientWidth;
        const height = 500;
        const filtered = currentPeriod === 'all' ? cardsData : cardsData.filter(c => c[1] == currentPeriod);
        const nodes = filtered.map(c => ({ id: c[0], title: c[2], period: c[1] }));
        const edges = [];
        filtered.forEach(card => {
            const [id, period, title, definition, causes, effects, continuity, compare] = card;
            const causeRels = findRelatedCards(id, causes);
            causeRels.forEach(rel => { edges.push({ source: rel.id, target: id, type: 'cause' }); });
            const effectRels = findRelatedCards(id, effects);
            effectRels.forEach(rel => { edges.push({ source: id, target: rel.id, type: 'effect' }); });
            const contRels = findRelatedCards(id, continuity + ' ' + compare);
            contRels.forEach(rel => { edges.push({ source: id, target: rel.id, type: 'continuity' }); });
            const compRels = findRelatedCards(id, compare);
            compRels.forEach(rel => { edges.push({ source: id, target: rel.id, type: 'compare' }); });
        });
        // Deduplicate edges
        const edgeMap = new Map();
        edges.forEach(e => {
            const key = `${e.source}-${e.target}-${e.type}`;
            if (!edgeMap.has(key)) edgeMap.set(key, e);
        });
        const uniqueEdges = Array.from(edgeMap.values());
        currentGraphNodes = nodes;
        currentGraphEdges = uniqueEdges;
        
        const svg = d3.select('#graphContainer')
            .append('svg')
            .attr('width', width)
            .attr('height', height)
            .attr('viewBox', `0 0 ${width} ${height}`)
            .style('background', '#fff')
            .style('border-radius', '20px');
        
        const colorMap = { cause: '#e67e22', effect: '#27ae60', continuity: '#2980b9', compare: '#8e44ad' };
        
        // Arrowhead marker
        svg.append('defs').append('marker')
            .attr('id', 'arrow')
            .attr('viewBox', '0 0 10 10')
            .attr('refX', 10)
            .attr('refY', 5)
            .attr('markerWidth', 6)
            .attr('markerHeight', 6)
            .attr('orient', 'auto')
            .append('path')
            .attr('d', 'M0,0 L10,5 L0,10 Z')
            .attr('fill', '#888');
        
        const simulation = d3.forceSimulation(nodes)
            .force('link', d3.forceLink(uniqueEdges).id(d => d.id).distance(150))
            .force('charge', d3.forceManyBody().strength(-300))
            .force('center', d3.forceCenter(width/2, height/2))
            .force('collision', d3.forceCollide().radius(40));
        
        const link = svg.append('g')
            .selectAll('line')
            .data(uniqueEdges)
            .enter()
            .append('line')
            .attr('stroke', d => colorMap[d.type])
            .attr('stroke-width', 2)
            .attr('stroke-dasharray', d => d.type === 'cause' ? '4' : '0')
            .attr('marker-end', 'url(#arrow)');
        
        const periodColors = ['#e34d4c','#f39c12','#f1c40f','#2ecc71','#3498db','#9b59b6','#7f8c8d','#5d6d7e','#2c3e50'];
        const nodeGroup = svg.append('g')
            .selectAll('g')
            .data(nodes)
            .enter()
            .append('g')
            .attr('cursor', 'pointer')
            .on('click', (event, d) => {
                showTimeline();
                const target = document.getElementById(`timeline-card-${d.id}`);
                if (target) target.scrollIntoView({ behavior: 'smooth' });
            });
        
        nodeGroup.append('circle')
            .attr('r', 12)
            .attr('fill', d => periodColors[d.period-1])
            .attr('stroke', '#fff')
            .attr('stroke-width', 2);
        nodeGroup.append('text')
            .attr('dy', 4)
            .attr('text-anchor', 'middle')
            .attr('fill', 'white')
            .attr('font-size', '10px')
            .attr('font-weight', 'bold')
            .text(d => d.id);
        nodeGroup.append('title').text(d => `${d.id}. ${d.title}`);
        link.append('title').text(d => `${d.type} relationship`);
        
        simulation.on('tick', () => {
            link.attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);
            nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
        });
        if (currentSimulation) currentSimulation.stop();
        currentSimulation = simulation;
    }

    // Period filter handler
    function setPeriod(period) {
        currentPeriod = period;
        document.querySelectorAll('.period-btn').forEach(btn => {
            if (btn.getAttribute('data-period') == period) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        if (document.getElementById('timelineContainer').classList.contains('active')) {
            buildTimeline();
        } else {
            if (currentSimulation) currentSimulation.stop();
            buildGraph();
        }
    }

    // View switching
    function showTimeline() {
        document.getElementById('timelineContainer').classList.add('active');
        document.getElementById('graphContainer').classList.remove('active');
        document.getElementById('timelineViewBtn').classList.add('active');
        document.getElementById('graphViewBtn').classList.remove('active');
        buildTimeline();
    }
    function showGraph() {
        document.getElementById('timelineContainer').classList.remove('active');
        document.getElementById('graphContainer').classList.add('active');
        document.getElementById('graphViewBtn').classList.add('active');
        document.getElementById('timelineViewBtn').classList.remove('active');
        buildGraph();
    }

    // Initialize period navigation
    function initPeriodNav() {
        const nav = document.getElementById('periodNav');
        if (!nav) return;
        nav.innerHTML = '<button class="period-btn active" data-period="all">All Periods</button>';
        for (let p = 1; p <= 9; p++) {
            const btn = document.createElement('button');
            btn.className = 'period-btn';
            btn.setAttribute('data-period', p);
            btn.innerText = `Period ${p}`;
            btn.addEventListener('click', () => setPeriod(p));
            nav.appendChild(btn);
        }
        const allBtn = nav.querySelector('[data-period="all"]');
        if (allBtn) allBtn.addEventListener('click', () => setPeriod('all'));
    }

    // Event binding and start
    function startApp() {
        initPeriodNav();
        document.getElementById('timelineViewBtn').addEventListener('click', showTimeline);
        document.getElementById('graphViewBtn').addEventListener('click', showGraph);
        // Default: graph view
        showGraph();
        // Resize handler
        window.addEventListener('resize', () => {
            if (document.getElementById('graphContainer').classList.contains('active')) {
                if (currentSimulation) currentSimulation.stop();
                buildGraph();
            }
        });
    }

    // Wait for DOM and D3
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startApp);
    } else {
        startApp();
    }
</script>
</body>
</html>
