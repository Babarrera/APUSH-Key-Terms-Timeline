<body>
<div class="container">
    <h1>📅 APUSH Complete 276 Cards | Timeline + Causal Graph</h1>
    <div class="sub">Click nodes → jump to timeline • Edges: cause, effect, continuity, compare</div>
    <div class="view-switch">
        <button class="view-btn" id="timelineViewBtn">📋 Timeline List</button>
        <button class="view-btn active" id="graphViewBtn">🕸️ Graph View (arrows)</button>
    </div>

    <div id="timelineContainer" class="timeline-container"></div>
    <div class="legend">
        <div><span style="background:#e67e22;"></span> Causes / preceded by</div>
        <div><span style="background:#27ae60;"></span> Effects / leads to</div>

        <div><span style="background:#8e44ad;"></span> Compare & Contrast</div>
    </div>

<script>
    window.cardsData = [];
    function addCard(id, period, title, definition, causes, effects, continuity, compare) {
        window.cardsData.push([id, period, title, definition, causes, effects, continuity, compare]);
    }

    // ========== PERIOD 1 (IDs 1-6) ==========
    addCard(1,1,"Pre-Columbian Native Societies (c. 1491)","Diverse, complex societies adapted to environments. Examples: Aztecs (urban Tenochtitlan, tribute), Pueblos (maize, cliff dwellings), Eastern Woodlands (matrilineal Iroquois, hunting/farming mix). Cahokia (30,000 near St. Louis, 1200 CE). Maize cultivation → less hunting/gathering, permanent villages. Iroquois Confederacy. Animism.","Migration via Bering Strait; adaptation to regional environments.","Population growth (Tenochtitlan 250,000); complex political structures; vulnerability to European diseases later.","Continuity – Native societies continued adapting to environment. Change – Maize shifted some from nomadic to sedentary; Cahokia rose and declined pre‑1492.","Aztecs (centralized empire) vs. Iroquois (confederacy) vs. Pueblos (village‑based). All agricultural but different political structures.");
    addCard(2,1,"Columbus's Voyage (1492)","Triggered Columbian Exchange – global transfer of goods, people, diseases, ideas between Old and New Worlds.","European search for direct trade routes to Asia; Spanish sponsorship.","Native demographic catastrophe (80%+ died from disease); rise of transatlantic slave trade; European dominance.","Continuity – European desire for wealth/empire continued. Change – Before 1492, hemispheres separate; after, permanently linked.","Columbus vs. later explorers (Cabot, Vespucci) – Columbus first to establish lasting contact; others mapped/conquered.");
    addCard(3,1,"Columbian Exchange (1492 onward)","Widespread exchange of animals, plants, microbes, people. Horses transformed Native mobility; corn/potatoes → European population boom; smallpox killed millions; tobacco fueled plantation economies; slavery created racial caste systems.","Contact between previously separate hemispheres after 1492.","New World got horses, cattle, wheat, sugar, Old World diseases. Old World got corn, potatoes, tomatoes, tobacco, syphilis. Massive Native depopulation; African slavery expanded.","Continuity – Trade between hemispheres continued. Change – Before exchange, no horses in Americas, no tomatoes in Europe; after, both transformed agriculture and warfare.","Old World vs. New World contributions – Old gave animals/diseases; New gave crops (corn, potato) that fueled population growth globally.");
    addCard(4,1,"Valladolid Debates (1550–1551)","Sepúlveda argued Indians are 'natural slaves' – intellectually inferior, savage practices, no private property. Las Casas argued Indians are brothers – sophisticated societies, capacity for reason, share humanity and Christian brotherhood.","Spanish brutality and forced conversion; religious and moral questions.","No clear winner, but Las Casas helped shift some Spanish policies; set precedent for human rights discussions.","Continuity – European racism toward Natives persisted. Change – First formal debate on treatment of conquered peoples; influenced later arguments for Native rights.","Sepúlveda (Aristotelian natural slavery) vs. Las Casas (Thomistic natural law/human dignity). Both Christian but opposite conclusions.");
    addCard(5,1,"Encomienda System (1500s)","Forced Native labor on plantations and mines. Spanish crown granted colonists labor/tribute in exchange for 'protection' and Christian instruction.","Need for cheap labor after Columbus; Spanish desire for gold/silver.","Massive Native population decline; replaced by African slave labor; creation of mestizo/mulatto classes.","Continuity – Forced labor systems persisted (replaced by African slavery). Change – Encomienda legally ended mid‑1500s; replaced by repartimiento.","Encomienda vs. English indentured servitude – both forced labor; encomienda claimed 'protection/Christianization'; indentured had contract end date.");
    addCard(6,1,"New France (1608)","French colony centered on fur trade. Alliances and intermarriage with Natives (Métis). Few settlers, no representative assembly.","Fur trade (beaver pelts) highly profitable; French Catholic missions.","Allied with Huron against Iroquois; limited colonial population; lost to Britain in 1763.","Continuity – France never sent large settlers; fur trade remained central. Change – After 1763, France lost all North American colonies.","New France vs. New Spain vs. New England – France: few settlers, good Native relations; Spain: conquest, encomienda; England: large settlements, Native exclusion.");

    // ========== PERIOD 2 (IDs 7-19) ==========
    addCard(7,2,"Jamestown Founded (1607)","First permanent English settlement. Initially disastrous; tobacco saved colony.","Joint‑stock company (Virginia Company) seeking profit; English rivalry with Spain.","Headright system; Bacon's Rebellion → shift to African slavery; House of Burgesses (1619) – first representative assembly.","Continuity – English continued founding colonies. Change – Jamestown shifted from gold‑seeking to tobacco agriculture; from mostly male to families.","Jamestown vs. Plymouth (1620) – Jamestown profit‑driven, Anglican; Plymouth religious refuge, Separatist.");
    addCard(8,2,"First Africans in Jamestown (1619)","First recorded Africans in English North America. Initially indentured servants, set stage for race‑based chattel slavery.","Atlantic slave trade already established; labor demand in tobacco fields.","Gradual codification of chattel slavery (status of mother determined enslavement); rigid racial caste system.","Continuity – Slavery existed worldwide. Change – Race‑based, hereditary chattel slavery (unique to Americas). First Africans had rights; by 1660s, permanent enslavement codified.","African slavery vs. indentured servitude – chattel slavery permanent, hereditary, race‑based; indentured had end dates.");
    addCard(9,2,"Mayflower Compact (1620)","Agreement signed by Pilgrims at Plymouth. Established self‑government by majority rule. First written framework in English colony.","Pilgrims landed outside Virginia Company's jurisdiction; needed social contract.","Model for later democratic governance; influenced New England town meetings.","Continuity – English tradition of written agreements. Change – First social contract in New World; precedent for colonial charters and Declaration of Independence.","Mayflower Compact vs. House of Burgesses – Compact direct democracy (all male signers); House representative (elected).");
    addCard(10,2,"New Amsterdam (1624–1664)","Dutch trading hub (later New York). Joint‑stock company, religious toleration, fur trade alliances with Iroquois (guns).","Dutch desire for commercial profit; mercantilism.","Became New York after English takeover (1664); legacy of religious and ethnic diversity.","Continuity – New York remained commercial and diverse under English. Change – Dutch patroon system replaced by English land grants; Dutch Reformed Church lost official status.","New Amsterdam vs. New England – Dutch focused on trade, tolerated diversity; English Puritans focused on religion, intolerant.");
    addCard(11,2,"Massachusetts Bay Colony / 'City upon a Hill' (1630)","Puritan colony led by John Winthrop. 'City upon a hill' – model Christian society. Self‑governance through freemen voting.","Religious persecution in England; desire for reformed Protestant society.","Religious intolerance (banished Roger Williams, Anne Hutchinson); town meeting government; foundation of New England identity.","Continuity – Puritan influence long after 1600s. Change – Religious uniformity gave way to toleration. 'City upon a hill' became American exceptionalism trope.","Massachusetts Bay vs. Rhode Island – Mass Bay religious intolerance; Rhode Island religious freedom, separation of church and state.");
    addCard(12,2,"Navigation Acts (1651–1730s)","British laws restricting colonial trade to English ships and enumerated goods (tobacco, sugar, cotton). Enforced mercantilism.","British desire to control trade and maximize wealth.","Limited colonial economic freedom; led to smuggling; salutary neglect allowed colonial autonomy; after 1763, stricter enforcement sparked resistance.","Continuity – Britain maintained mercantilism. Change – Salutary neglect (pre‑1763) vs. strict enforcement (post‑1763). Shift caused colonial resentment and revolution.","Navigation Acts vs. American mercantilism later (Hamilton's plan) – both protected domestic industry; British system benefited mother country; American system benefited new nation.");
    addCard(13,2,"Bacon's Rebellion (1676)","Nathaniel Bacon led frontier farmers (former indentured servants) attacking Natives then burning Jamestown, opposing Governor Berkeley's friendly Native policies.","Land scarcity for freed indentured servants; conflict with Natives; resentment toward coastal elite.","Planters turned to African slaves as more controllable labor force. Exposed class tensions. Accelerated shift to race‑based slavery.","Continuity – Class tensions between elite and poor persisted. Change – Shift from indentured servitude to slavery as primary labor; white unity across class developed after.","Bacon's Rebellion vs. Shays' Rebellion (1786) – both farmers against elites; Bacon attacked Natives and rich; Shays attacked courts over debt. Bacon accelerated slavery shift; Shays accelerated Constitution.");
    addCard(14,2,"Metacom's War / King Philip's War (1675–1676)","Bloody conflict between New England colonists and Native coalition led by Metacom (King Philip). Devastated Native power in New England.","Colonial expansion onto Native lands; broken treaties; pressure on Native resources.","Thousands dead on both sides; Native resistance crushed; New England colonists secured dominance; symbolized failure of coexistence.","Continuity – Native resistance elsewhere (Pontiac's Rebellion 1763). Change – After 1676, New England Natives never again posed major military threat.","Metacom's War vs. Pueblo Revolt (1680) – both uprisings; Pueblo succeeded temporarily; Metacom failed disastrously. Different outcomes due to Spanish vs. English colonial patterns.");
    addCard(15,2,"Pueblo Revolt (1680)","Successful Native uprising against Spanish in New Mexico. Destroyed churches, killed settlers, drove Spanish out for ~12 years.","Forced labor (encomienda), forced conversion, suppression of Pueblo religion.","Spanish returned with more tolerance; became more cautious about forced conversion; symbol of Native resistance.","Continuity – Spanish colonial control eventually reestablished. Change – Only successful Native expulsion of Europeans in North America; Spanish changed tactics afterward.","Pueblo Revolt vs. Metacom's War – Pueblo succeeded temporarily; Metacom failed. Different outcomes due to Spanish vs. English colonial patterns.");
    addCard(16,2,"Salem Witch Trials (1692)","Series of hearings and executions for alleged witchcraft; 20+ executed. Example of religious extremism and social anxiety.","Puritan religious intensity; social tensions (family feuds, economic changes); fear of outsiders/change.","Decline of Puritan religious authority; shift toward rational/Enlightenment thinking; caution against mass hysteria.","Continuity – Religious enthusiasm continued (Great Awakening 1730s‑40s). Change – After Salem, legal standards changed (spectral evidence no longer allowed); Puritan theocracy weakened.","Salem vs. European witch hunts – both used spectral evidence; Salem scale smaller but became symbol of American religious extremism.");
    addCard(17,2,"Stono Rebellion (1739)","Slave uprising in South Carolina. ~20 enslaved people gathered near Stono River, killed several whites, attempted to flee to Spanish Florida.","Brutal conditions of chattel slavery; Spanish promise of freedom to runaways.","Stricter slave codes (Negro Act of 1740) – prohibited assembly, education, earning money; reduced enslaved people's autonomy.","Continuity – Slave rebellions continued (NY 1712, Gabriel 1800, Nat Turner 1831). Change – After Stono, South Carolina's slave codes became the model for other colonies; enslaved people's legal rights virtually eliminated.","Stono vs. Nat Turner (1831) – Stono goal: reach Spanish Florida; Turner's religious vision. Both crushed; Stono led to stricter codes; Turner's led to even harsher codes and anti‑abolitionist backlash.");
    addCard(18,2,"First Great Awakening (1730s–1770s)","Religious revival emphasizing emotional, personal faith. Key figures: Jonathan Edwards ('Sinners in the Hands of an Angry God'), George Whitefield. Old Lights vs. New Lights.","Reaction against dry, intellectual Enlightenment rationalism; desire for emotional religious experience.","Undermined established church authority; encouraged individualism and questioning of authority; fostered shared colonial identity (first 'American' event); increased religious denominations (Baptists, Methodists).","Continuity – Religious revivals recur (Second Great Awakening 1800s). Change – Before, colonies had established churches; after, religious pluralism and disestablishment. First time colonists saw themselves as 'Americans' across colonies.","First Great Awakening vs. Second Great Awakening. First: individual salvation, emotional preaching; Second: social reform (abolition, temperance), Charles Finney. Both undermined authority.");
    addCard(19,2,"Enlightenment (18th century)","Intellectual movement emphasizing reason, science, natural law, and individual rights. Key figures: John Locke (natural rights: life, liberty, property), Montesquieu (separation of powers), Rousseau (social contract).","Scientific Revolution; European philosophers who challenged absolutism; colonial education and transatlantic print culture.","Philosophical foundation for American Revolution; influenced Declaration of Independence, Constitution, Bill of Rights.","Continuity – Enlightenment ideals remain central. Change – Before, divine right of kings; after, government by consent.","Enlightenment vs. Great Awakening – reason vs. emotion; both undermined traditional authority from opposite directions.");

    // ========== PERIOD 3 (IDs 20-50) – First half ==========
    addCard(20,3,"French and Indian War / Seven Years' War (1754–1763)","Global conflict between Britain and France. Ended with Treaty of Paris (1763): Britain gained French Canada and all land east of the Mississippi.","Competing claims to Ohio Valley; colonists wanted to expand west.","Britain incurred massive war debt → ended salutary neglect → imposed new taxes.","Continuity – Anglo‑French rivalry continued. Change – France removed from North America.","French and Indian War vs. American Revolution – In first, colonists fought with Britain; in second, against.");
    addCard(21,3,"Albany Plan of Union (1754)","Benjamin Franklin's proposal for a unified colonial government. Rejected.","Need for coordinated defense during French and Indian War.","Set precedent for later unification (Continental Congress).","Continuity – colonies acted independently until 1770s. Change – first formal proposal for federal government.","Albany Plan vs. Articles of Confederation – both created weak central councils.");
    addCard(22,3,"Pontiac's Rebellion (1763)","Native uprising against British forts.","British takeover of French lands; refusal to give gifts.","Led to Proclamation of 1763.","Continuity – Native resistance continued. Change – directly triggered Proclamation Line.","Pontiac's Rebellion vs. Metacom's War – both pan‑Native uprisings.");
    addCard(23,3,"Proclamation of 1763","British decree forbidding colonial settlement west of Appalachians.","British desire to avoid costly Indian wars.","Angered colonists; one of grievances in Declaration.","Continuity – Britain tried to restrict expansion before. Change – directly limited westward movement.","Proclamation vs. Northwest Ordinance – British restriction vs. American encouragement.");
    addCard(24,3,"Sugar Act (1764)","Tax on foreign molasses; strict enforcement.","British need for revenue after war.","Colonists argued 'no taxation without representation'.","Continuity – previous taxes existed. Change – first tax aimed at revenue.","Sugar Act vs. Stamp Act – external vs internal tax.");
    addCard(25,3,"Stamp Act (1765)","First direct tax on colonists – stamps on paper goods.","British need for revenue.","Stamp Act Congress, Sons of Liberty, boycotts.","Continuity – boycotts used later. Change – first intercolonial political meeting.","Stamp Act vs. Townshend Acts – internal vs external duties.");
    addCard(26,3,"Townshend Acts (1767–1768)","Taxes on imported goods (glass, lead, paint, paper, tea). Revenue paid royal governors' salaries.","British need for revenue; assert authority.","Colonial boycotts; British troops sent to Boston → Boston Massacre.","Continuity – taxation without representation persisted. Change – attacked colonial self‑government.","Townshend vs. Sugar Act – both external duties; Townshend undermined political autonomy.");
    addCard(27,3,"Boston Massacre (1770)","British soldiers fired into crowd, killing five.","Tensions from Townshend Acts; presence of troops.","Increased anti‑British sentiment; used as propaganda.","Continuity – military-civilian clashes continued. Change – Patriot propaganda intensified.","Boston Massacre vs. Kent State – both armed forces firing on civilians.");
    addCard(28,3,"Tea Act (1773)","Granted British East India Company monopoly on tea sales. Lowered price but kept tax.","British wanted to save the company; assert right to tax.","Boston Tea Party – colonists dumped tea into harbor.","Continuity – resistance to monopolies/taxes. Change – destruction of property escalated conflict.","Tea Act vs. Stamp Act – Stamp caused boycotts; Tea Act caused direct action.");
    addCard(29,3,"Intolerable Acts / Coercive Acts (1774)","Closed Boston Harbor, revoked Massachusetts charter, allowed quartering of troops.","Punish Boston for Tea Party.","First Continental Congress; militias organized; path to revolution.","Continuity – punitive acts before. Change – first time charter dissolved and harbor closed.","Intolerable Acts vs. Navigation Acts – trade restriction vs direct attack on self‑government.");
    addCard(30,3,"First Continental Congress (1774)","12 colonies met; issued Declaration of Rights, boycotted British goods.","Intolerable Acts; need for coordinated resistance.","Set up militias; laid groundwork for Second Congress.","Continuity – colonial assemblies met before (Stamp Act Congress). Change – prepared for military resistance.","First Continental vs. Second Continental – sought redress vs managed war.");
    addCard(31,3,"Lexington and Concord (April 19, 1775)","'Shot heard round the world.' First military engagement of Revolution.","British sought to seize colonial weapons.","Revolutionary War began.","Continuity – militias had fought before (French & Indian War). Change – now fighting against British.","Lexington vs. Fort Sumter – both first battles of major wars.");
    addCard(32,3,"Common Sense (January 1776)","Thomas Paine's pamphlet calling for immediate independence.","Growing resentment; many still hoped for reconciliation.","Shifted public opinion toward independence.","Continuity – pamphlets used before. Change – explicitly called for independence, reached common people.","Common Sense vs. Federalist Papers – revolutionary call vs constitutional defense.");
    addCard(33,3,"Declaration of Independence (July 4, 1776)","Jefferson's document based on Locke's natural rights. Listed grievances against King.","War ongoing; reconciliation impossible.","Formalized revolution; inspired other movements.","Continuity – Locke's ideas used before. Change – broke all legal ties with Britain.","DOI vs. Declaration of Sentiments – same structure, different oppressor.");
    addCard(34,3,"Battle of Saratoga (1777)","American victory; British General Burgoyne surrendered.","British strategy failed; Howe went to Philadelphia instead.","Turning point; France became formal ally.","Continuity – Americans had won battles before (Trenton). Change – first major British army surrender.","Saratoga vs. Yorktown – brought France into war vs final victory.");
    addCard(35,3,"Articles of Confederation (ratified 1781)","First constitution; weak central government.","Fear of strong central authority.","Shays' Rebellion exposed weakness; led to Constitutional Convention.","Continuity – states remained sovereign. Change – first written national constitution.","AOC vs. Constitution – weak central vs strong central.");
    addCard(36,3,"Treaty of Paris (1783)","Ended Revolutionary War; recognized U.S. independence.","American victory at Yorktown.","U.S. territory doubled; Loyalists fled.","Continuity – post‑war treaties essential. Change – first treaty where Britain recognized U.S. sovereignty.","1783 Treaty vs. 1763 Treaty – U.S. independence vs British dominance.");
    addCard(37,3,"Shays' Rebellion (1786–1787)","Farmers' uprising over debt and taxes.","Post‑war depression; weak AOC.","Exposed AOC weakness; led to Constitutional Convention.","Continuity – debtors' revolts before (Bacon's). Change – government could not respond.","Shays vs. Whiskey Rebellion – under AOC vs under Constitution.");
    addCard(38,3,"Constitutional Convention (1787)","Met to revise AOC; wrote new Constitution.","Shays' Rebellion; need for stronger federal government.","Created separation of powers, federalism, executive branch.","Continuity – representative government retained. Change – dramatically strengthened federal power.","Convention vs. First Continental Congress – made new government vs protested.");
    addCard(39,3,"Federalist Papers (1787–1788)","85 essays defending Constitution.","Anti‑Federalist opposition.","Helped secure ratification, especially in New York.","Continuity – political pamphlets used before. Change – most systematic defense of Constitution.","Federalist vs. Anti‑Federalist – strong central vs states' rights.");
    addCard(40,3,"Anti‑Federalists & Bill of Rights (1791)","Opponents of Constitution demanded protections for individual liberties.","Original Constitution lacked a bill of rights.","First 10 amendments added; limited federal power.","Continuity – suspicion of strong central government persisted. Change – Bill of Rights became foundational.","Anti‑Federalists vs. Jeffersonian Democrats – both favored states' rights.");
    addCard(41,3,"Republicanism (1760s–1780s)","Government based on consent of governed, elected representatives, civic virtue.","Enlightenment ideas; rejection of monarchy.","Foundation for Revolution and Constitution.","Continuity – core of U.S. political culture. Change – republic replaced monarchy.","Republicanism vs. Classical Liberalism – civic virtue vs individual rights.");
    addCard(42,3,"Hamilton's Financial Plan (1790–1791)","Assumption of state debts, national bank, tariffs, whiskey tax.","Post‑war debt; weak credit.","Created first political parties (Federalists vs Democratic‑Republicans).","Continuity – debt management existed. Change – loose construction (implied powers).","Hamilton vs. Jefferson – industrial vs agrarian.");
    addCard(43,3,"Whiskey Rebellion (1794)","Farmers protested whiskey tax; Washington led federal troops to crush it.","Hamilton's tax.","Demonstrated federal government could enforce laws – contrast with Shays.","Continuity – farmer tax rebellions. Change – federal response proved Constitution effective.","Whiskey vs. Shays – federal response vs none.");
    addCard(44,3,"Jay's Treaty (1795)","Treaty with Britain: avoided war, but angered France.","Tensions with Britain; Washington wanted peace.","Split Federalists and Democratic‑Republicans; led to XYZ Affair.","Continuity – neutrality continued. Change – tilt toward Britain.","Jay's vs. Pinckney's – unpopular vs popular.");
    addCard(45,3,"Pinckney's Treaty (1795)","Treaty with Spain: granted U.S. navigation of Mississippi and deposit at New Orleans.","Spain feared US‑British alliance after Jay's Treaty.","Opened western trade; enabled westward expansion.","Continuity – commercial treaties. Change – gave U.S. control of Mississippi.","Pinckney's vs. Jay's – popular vs unpopular.");
    addCard(46,3,"Washington's Farewell Address (1796)","Warned against political parties and permanent foreign alliances.","Washington's desire to guide future policy.","Established two‑term precedent; influenced U.S. foreign policy for 150 years.","Continuity – isolationist sentiment. Change – two‑term tradition.","Farewell Address vs. Monroe Doctrine – both foundational foreign policy statements.");
    addCard(47,3,"XYZ Affair (1797–1798)","French agents demanded bribe for negotiations.","French anger at Jay's Treaty.","Quasi‑War with France; Alien and Sedition Acts.","Continuity – European disrespect for neutrality. Change – turned from French ally to quasi‑enemy.","XYZ vs. Zimmermann Telegram – both foreign affronts leading to war sentiment.");
    addCard(48,3,"Alien and Sedition Acts (1798)","Laws restricting immigrants and criminalizing criticism of government.","Federalist fear of foreign influence; Quasi‑War with France.","Backlash helped Jefferson win 1800; Kentucky and Virginia Resolutions.","Continuity – wartime suppression of dissent. Change – first major federal speech restrictions.","Alien and Sedition Acts vs. Espionage Act – both suppressed dissent.");
    addCard(49,3,"Kentucky and Virginia Resolutions (1798–1799)","Argued states could nullify unconstitutional federal laws.","Response to Alien and Sedition Acts.","Theoretical foundation for later states' rights arguments (nullification, secession).","Continuity – states' rights arguments persisted. Change – pushed nullification theory to extreme.","Resolutions vs. South Carolina Exposition – both argued nullification.");
    addCard(50,3,"Revolution of 1800 (Election of 1800)","First peaceful transfer of power between opposing parties.","Backlash against Federalist policies; Alien and Sedition Acts.","Jefferson elected; Federalist decline.","Continuity – elections continued. Change – first time opposing party took power peacefully.","1800 vs. 1860 – peaceful transfer vs secession.");
