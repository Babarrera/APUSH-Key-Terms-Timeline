</script>
<script>
    // ---------- PART 5: PERIODS 5 & 6 (cards 94–146) ----------
    window.cardsData.push(
        // PERIOD 5 (cards 94-117)
        [94,5,"Compromise of 1850","A package of five bills: (1) California admitted as a free state; (2) Utah and New Mexico territories organized with popular sovereignty; (3) stricter Fugitive Slave Law; (4) slave trade abolished in Washington, D.C.; (5) Texas gave up claim to New Mexico for $10 million.","Gold rush led California to apply as free state, threatening Senate balance. Southerners threatened secession. Henry Clay and Stephen Douglas engineered package.","Fugitive Slave Law backfired – required Northerners to help catch runaways, denied jury trial, paid commissioners more for returning than freeing. Radicalized many Northerners. Temporarily delayed secession (~10 years) but didn't settle conflict.","Continuity – Compromises had resolved earlier sectional crises (Missouri Compromise, Tariff of 1833). Change – Fugitive Slave Law forced Northern citizens to participate in slavery, unprecedented. Compromise lasted only 4 years before Kansas‑Nebraska Act.","Missouri Compromise vs. Compromise of 1850. Missouri set a line; 1850 used popular sovereignty. Missouri lasted 34 years; 1850 lasted 4 years."],
        [95,5,"Fugitive Slave Law (1850)","Required citizens to assist in capture and return of runaway slaves. Alleged fugitives denied jury trial. Federal commissioners paid $10 for returning a runaway, only $5 if they freed them – built‑in bribe. Heavy penalties for helping runaways.","Southern demand for enforcement of constitutional fugitive slave clause; felt loss of California as free state required stronger fugitive law.","Northerners forced to participate in slavery. Many became furious. Underground Railroad expanded. Several Northern states passed 'personal liberty laws' to nullify federal law. Turned moderate Northerners into anti‑slavery voters, fueling rise of Republican Party.","Continuity – Fugitive slave law existed (1793) but weakly enforced. Change – 1850 law was draconian: no jury trial, financial incentive, federal marshals could compel citizens. Made slave catching federal duty, violating states' rights.","Fugitive Slave Law (1850) vs. 1793 law. 1793 allowed owners to seize runaways but left enforcement to local authorities; 1850 created federal commissioners, paid for convictions, denied jury trials."],
        [96,5,"Kansas‑Nebraska Act (1854)","Sponsored by Stephen Douglas. Organized Kansas and Nebraska territories with popular sovereignty, explicitly repealing Missouri Compromise line (36°30'). Opened territories to possible slavery.","Douglas wanted transcontinental railroad through Chicago; to get Southern support, agreed to repeal Missouri Compromise. Believed in popular sovereignty.","'Bleeding Kansas' – civil war between pro‑slavery 'Border Ruffians' and anti‑slavery 'Free‑Staters.' Destroyed Whig Party; led to creation of Republican Party (1854). Widely seen as single most important cause of Civil War.","Continuity – Popular sovereignty used in Compromise of 1850 (Utah, New Mexico). Change – Kansas‑Nebraska repealed 34‑year‑old Missouri Compromise, which many Northerners saw as sacred pact. Broke moral trust and destroyed Second Party System.","Kansas‑Nebraska Act vs. Missouri Compromise (1820). Missouri drew a line; Kansas‑Nebraska erased it. Missouri temporarily resolved issue; Kansas‑Nebraska caused Bleeding Kansas and Civil War."],
        [97,5,"Bleeding Kansas (1855–1859)","Violent conflict in Kansas Territory between pro‑slavery and anti‑slavery settlers. Pro‑slavery 'Border Ruffians' from Missouri crossed to vote illegally. Anti‑slavery 'Free‑Staters' established rival government. Violence escalated: Sack of Lawrence, then John Brown's Pottawatomie Creek Massacre (killed five pro‑slavery settlers with broadswords). Over 150 killed; preview of Civil War.","Kansas‑Nebraska Act (1854); popular sovereignty turned into contest of settlers and violence.","Nation watched in horror. John Brown became folk hero to abolitionists, terrorist to pro‑slavery forces. Violence radicalized both sides. Republican Party used 'Bleeding Kansas' as rallying cry against 'Slave Power.'","Continuity – Sectional violence had occurred before (Caning of Sumner, 1856). Change – Bleeding Kansas was first armed conflict between pro‑ and anti‑slavery forces on U.S. soil. Directly foreshadowed Civil War.","Bleeding Kansas vs. Civil War (1861‑65). Both violent struggles over slavery. Bleeding Kansas localized with irregular forces; Civil War full‑scale conventional war."],
        [98,5,"Caning of Charles Sumner (1856)","Senator Sumner (R‑MA) delivered speech 'The Crime Against Kansas,' verbally attacking Senator Andrew Butler (D‑SC). Two days later, Butler's nephew, Rep. Preston Brooks (D‑SC), beat Sumner unconscious with heavy cane on Senate floor. Sumner suffered severe head injuries, did not return for three years.","Sectional hatred; 'honor culture' of South; Sumner's insulting language.","Sumner became martyr in North (kept seat empty as symbol). Brooks hailed as hero in South – admirers sent dozens of replacement canes. Showed reasoned debate had collapsed; violence replaced civility on Senate floor.","Continuity – Political violence occurred before (duels, brawls). Change – First time senator beaten nearly to death on Senate floor. Symbolized complete breakdown of political system.","Caning of Sumner vs. modern political violence. 1850s violence between sections; today often between parties. Caning remains most infamous act of congressional violence."],
        [99,5,"Dred Scott v. Sandford (1857)","Supreme Court case. Dred Scott, enslaved man taken into free territory (Illinois and Wisconsin Territory, where slavery banned by Missouri Compromise), sued for freedom. Chief Justice Roger Taney ruled: (1) Blacks not citizens, no standing to sue; (2) Slaves property protected by 5th Amendment; (3) Congress had no power to ban slavery in territories – Missouri Compromise unconstitutional.","Scott sued; case reached Supreme Court. Taney hoped to resolve slavery question once and for all – but made it worse.","Outraged North – Court declared slavery could not be restricted anywhere in territories. Declared popular sovereignty unconstitutional. Pushed nation closer to war. Major factor in Lincoln's election (he argued conspiracy to nationalize slavery).","Continuity – Court had protected slavery before (Prigg v. Pennsylvania, 1842). Change – Dred Scott most sweeping pro‑slavery decision. Declared Missouri Compromise – 34‑year‑old law – unconstitutional. Said Blacks could never be citizens, overturned by 14th Amendment (1868).","Dred Scott vs. 14th Amendment (1868). Dred Scott said Blacks not citizens; 14th declared all persons born in U.S. citizens."],
        [100,5,"Lincoln‑Douglas Debates (1858)","Series of seven debates between Abraham Lincoln (Republican Senate candidate) and Stephen Douglas (incumbent Democrat) in Illinois. Main issue: slavery in territories. Lincoln's 'House Divided' speech: 'A house divided against itself cannot stand.' Douglas's Freeport Doctrine: people of territory could exclude slavery by refusing to pass laws protecting it (unfriendly legislation).","Senate race; both knew winner might become president in 1860.","Lincoln lost election (Douglas won Senate seat), but debates made Lincoln nationally famous. Douglas's Freeport Doctrine alienated Southern Democrats – they wanted slavery protected, not merely allowed. Split Democratic Party in 1860, paving way for Lincoln's election as president.","Continuity – Political debates occurred before. Change – Lincoln‑Douglas debates covered nationally by newspapers (telegraph). Focused nation's attention on slavery question as no other event.","Lincoln vs. Douglas on slavery. Douglas: popular sovereignty – let white settlers decide. Lincoln: slavery immoral and should not be expanded. Both wanted preserve Union, but Lincoln believed Union could not survive half‑slave, half‑free."],
        [101,5,"John Brown's Raid on Harpers Ferry (1859)","John Brown, abolitionist who fought in Bleeding Kansas, led small force (21 men, including 5 Black men) to seize federal arsenal at Harpers Ferry, Virginia (now West Virginia). Hoped to spark massive slave rebellion. Raid failed; Brown and men surrounded by U.S. Marines led by Col. Robert E. Lee. Brown captured, tried for treason, hanged.","Brown believed slavery was sin and only violence would end it. Saw himself as instrument of God's wrath.","Brown became martyr in North (Emerson: 'He will make the gallows as glorious as the cross'). In South, raid confirmed worst fears – North wanted to incite bloody slave rebellions. South began organizing militias and preparing for war. Final tipping point before secession.","Continuity – Slave rebellion attempts existed before (Nat Turner, Gabriel, Vesey). Change – Brown was white and raid funded by prominent Northern abolitionists ('Secret Six'). Convinced South that North was not just opposed to slavery expansion but actively planning to destroy slavery by violence.","John Brown vs. Nat Turner (1831). Both executed for leading attacks that killed whites. Turner enslaved man leading enslaved people; Brown white man leading racially mixed group. Brown's raid terrifying because it had white Northern support."],
        [102,5,"Election of 1860","Four‑way race: Abraham Lincoln (Republican – anti‑slavery expansion); Stephen Douglas (Northern Democrat – popular sovereignty); John C. Breckinridge (Southern Democrat – pro‑slavery); John Bell (Constitutional Union – preserve Union). Lincoln won 40% popular vote but majority of electoral college (180 of 303). Won no Southern electoral votes.","Democratic Party split into Northern and Southern wings over slavery. Republican Party united around free‑soil platform. South saw Lincoln's election as mortal threat to slavery.","South Carolina seceded December 20, 1860 (before Lincoln took office). Six more states followed, forming Confederate States of America (February 1861) with Jefferson Davis as president. Lincoln called secession unconstitutional, but did not immediately use force.","Continuity – Sectional voting patterns existed before (1848, 1856). Change – Lincoln won without a single Southern electoral vote – first president to do so. Southern secession immediate and unprecedented.","Election of 1860 vs. Election of 1800. 1800 peaceful transfer of power between parties; 1860 led to secession and civil war."],
        [103,5,"Fort Sumter (April 12–13, 1861)","Confederate forces bombarded Fort Sumter, federal fort in Charleston Harbor, South Carolina. Fort surrendered after 34 hours. No one killed in bombardment (two Union soldiers died in accidental explosion during surrender). First military engagement of Civil War.","Lincoln announced he would resupply fort (not reinforce). Confederacy saw as aggression and demanded surrender. When fort refused, they opened fire.","North united – Lincoln called for 75,000 volunteers to put down rebellion. Four more states (Virginia, North Carolina, Tennessee, Arkansas) seceded and joined Confederacy. Border states (Delaware, Maryland, Kentucky, Missouri) remained in Union but deeply divided. Civil War began.","Continuity – Wars often start with 'first battle' (Lexington and Concord, 1775). Change – Fort Sumter attack on federal fort after states had already seceded. Lincoln's call for troops provoked Upper South to secede.","Fort Sumter vs. Pearl Harbor (1941). Both triggered national unity and declaration of war. Sumter attack on federal fort by Confederacy; Pearl Harbor surprise attack by foreign power."],
        [104,5,"Emancipation Proclamation (January 1, 1863)","Lincoln's executive order freeing slaves only in areas of rebellion (Confederate states). Did not free slaves in Border States or Union‑controlled parts of South. Also authorized enlistment of Black soldiers (about 180,000 served).","Military necessity – freeing slaves would weaken Southern economy and labor force. Also needed to keep Britain and France from recognizing Confederacy (both had abolished slavery). Lincoln waited for Union victory (Antietam, September 1862) to issue it.","Changed war goal from preserving Union to ending slavery (though not completely until 13th Amendment). Black enlistment began (54th Massachusetts). European nations did not recognize Confederacy. Moral turning point, but did not free a single slave in areas where U.S. had no power.","Continuity – Wartime emancipation used before (British in Revolution). Change – Proclamation was presidential order, not law. Transformed Union's cause from war for Union to war for freedom.","Emancipation Proclamation vs. 13th Amendment (1865). Proclamation war measure, temporary in theory, applied only to Confederate areas. 13th Amendment permanent, nationwide, abolished slavery entirely."],
        [105,5,"Battle of Gettysburg (July 1–3, 1863)","Largest battle of Civil War (and North America). Union General George Meade defeated Confederate General Robert E. Lee's invasion of Pennsylvania. Total casualties: about 51,000 (23,000 Union, 28,000 Confederate). Turning point of war in East. Lee's army never recovered.","Lee wanted to take war out of Virginia, threaten Northern city, win decisive victory on Northern soil to force European recognition and peace negotiations, obtain supplies.","Lee's invasion stopped. Confederate army retreated to Virginia. Gettysburg Address (November 19, 1863) redefined war as struggle for democracy and 'new birth of freedom.' Victory combined with Vicksburg gave Union momentum.","Continuity – Decisive battles occurred earlier (Antietam, Shiloh). Change – Gettysburg last major Confederate offensive in North. After, Lee fought defensive war.","Gettysburg vs. Antietam (1862). Antietam bloodiest single day; Gettysburg bloodiest three days. Antietam tactical draw allowing Emancipation Proclamation; Gettysburg clear Union victory turning tide."],
        [106,5,"Gettysburg Address (November 19, 1863)","Lincoln's speech at dedication of Soldiers' National Cemetery in Gettysburg. 272 words redefining Civil War not just as struggle to preserve Union, but as 'new birth of freedom' ensuring 'government of the people, by the people, for the people, shall not perish from the earth.'","Need to honor fallen soldiers; reframe war's purpose after Emancipation Proclamation; lift Northern morale.","Articulated core American ideals. One of most famous speeches in U.S. history. Shifted war's meaning from constitutional conflict to moral crusade for democracy itself.","Continuity – Presidential addresses rallied nation before (Washington's Farewell). Change – Gettysburg Address redefined Constitution's purpose as preserving democratic governance.","Gettysburg Address vs. Declaration of Independence. Declaration announced birth of nation; Address rededicated nation to same principles in midst of greatest crisis."],
        [107,5,"Battle of Vicksburg (May 18 – July 4, 1863)","Siege of Vicksburg, Mississippi by Union General Ulysses S. Grant. Last Confederate stronghold on Mississippi River. After 47‑day siege, Confederate garrison surrendered July 4, 1863 – day after Gettysburg.","Anaconda Plan – to split Confederacy by controlling Mississippi River. Grant's brilliant campaign: marched army south of Vicksburg, cut supply lines, trapped enemy.","Union controlled entire Mississippi River, splitting Confederacy in two (Texas, Arkansas, Louisiana cut off from rest of South). Grant promoted to overall commander of Union armies. Victory combined with Gettysburg turned war decisively in Union's favor.","Continuity – Siege warfare existed long before. Change – Vicksburg most successful Union campaign to that point. Demonstrated Grant's tenacity and strategic genius.","Vicksburg vs. Gettysburg. Both Union victories July 1863. Gettysburg three‑day battle; Vicksburg 47‑day siege. Gettysburg stopped Confederate invasion; Vicksburg split Confederacy."],
        [108,5,"Sherman's March to the Sea (November 15 – December 21, 1864)","After capturing Atlanta, Union General William Tecumseh Sherman led 60,000 troops on destructive march from Atlanta to Savannah, Georgia. Ordered 'total war' – destroying railroads, factories, bridges, farms, civilians' property to break South's will to fight. Army lived off land, confiscating food and supplies.","Sherman believed destroying South's infrastructure and morale necessary to end war quickly. Wanted civilian population to feel war's costs so they would pressure leaders to surrender.","March devastated Georgia – estimated $100 million property damage (billions today). Shredded Confederate economy and morale. Sherman turned north through Carolinas, further destroying resistance. Demonstrated 'total war' – targeting not just enemy armies but economic and psychological capacity to fight.","Continuity – Union armies destroyed infrastructure before (e.g., railroads in Virginia). Change – Sherman's March systematic, 300 miles long, explicitly targeted civilian property (though not civilians themselves). First modern 'total war' campaign.","Sherman's March vs. Union scorched earth elsewhere. Earlier campaigns burned specific depots or bridges; Sherman's March sustained, broad‑front destruction of everything in path."],
        [109,5,"Appomattox Court House (April 9, 1865)","Confederate General Robert E. Lee surrendered to Union General Ulysses S. Grant at Appomattox Court House, Virginia. Grant offered generous terms: Confederates keep horses and mules, officers keep sidearms, all paroled and allowed to return home without prosecution for treason. Lincoln had instructed Grant to be lenient.","Lee's army surrounded, outnumbered, starving. No supplies and no hope of escape.","Civil War effectively ended (other Confederate armies surrendered later that spring). Reconstruction began. Five days after surrender (April 14, 1865), Lincoln assassinated by John Wilkes Booth at Ford's Theatre. Andrew Johnson became president.","Continuity – Surrenders end wars. Change – Grant's generous terms (no trials, no property confiscation, parole) unusual. Intended to heal nation, but allowed Confederate leaders to quickly regain political power during Reconstruction, leading to failure of Reconstruction and rise of Jim Crow.","Appomattox vs. unconditional surrender in WWII. Grant's terms lenient; Allies demanded unconditional surrender from Germany and Japan in 1945, followed by occupation and denazification."],
        [110,5,"13th Amendment (1865)","Abolished slavery throughout United States. Passed Congress January 1865, ratified December 1865. Section 1: 'Neither slavery nor involuntary servitude, except as punishment for crime whereof party shall have been duly convicted, shall exist within the United States.'","Emancipation Proclamation was war measure that might not survive peace; Lincoln wanted permanent, constitutional solution. Pushed for amendment in 1864 reelection campaign.","Slavery abolished nationwide. Exception ('except as punishment for crime') later used to create convict leasing system re‑enslaving thousands of Black men (especially in South). First of three Reconstruction Amendments (13th, 14th, 15th).","Continuity – Slavery abolished, but other coerced labor (sharecropping, convict leasing, peonage) persisted decades. Change – 13th Amendment first constitutional change to expand individual liberty since Bill of Rights. Gave Congress power to enforce – leading to civil rights laws.","13th Amendment vs. Emancipation Proclamation. Proclamation war measure, applied only to Confederate areas, could theoretically be reversed. 13th permanent, nationwide, constitutional abolition."],
        [111,5,"Reconstruction (1865–1877)","Period after Civil War when Southern states readmitted to Union and status of 4 million freed people determined. Three competing plans: Lincoln's 10% Plan (lenient); Johnson's Plan (very lenient); Congressional (Radical) Reconstruction (harsh – South divided into 5 military districts, required new state constitutions guaranteeing Black male suffrage, ratification of 14th Amendment). Freedmen's Bureau established.","Need to readmit Southern states; determine legal and economic status of freed people; deal with Confederate leaders; rebuild devastated South.","14th (1868) and 15th (1870) Amendments passed. Black men voted and held office (Hiram Revels, Blanche K. Bruce in U.S. Senate). White Southerners resisted through Black Codes, Klan violence, and eventually 'Redeemer' governments after Compromise of 1877. Reconstruction ended 1877 with federal troops withdrawn, leaving Black rights unprotected.","Continuity – Racial inequality persisted long after Reconstruction (Jim Crow, segregation, disfranchisement). Change – Reconstruction first time Black Americans voted, held office, guaranteed (on paper) equal protection. After 1877, white Southerners regained power and dismantled gains, but 14th and 15th Amendments remained.","Presidential Reconstruction (Lincoln/Johnson) vs. Radical Reconstruction. Presidential: lenient, no long‑term occupation, quickly readmitted states without requiring Black suffrage. Radical: harsh, military districts, forced states to ratify 14th Amendment and guarantee Black voting rights."],
        [112,5,"Civil Rights Act of 1866","First federal law to define citizenship. Declared all persons born in U.S. (except Natives) citizens regardless of race. Granted equal benefit of laws. Passed over President Andrew Johnson's veto.","Black Codes passed in Southern states restricted freedmen's rights; Radical Republicans wanted federal protection.","Overturned Dred Scott; constitutionality questioned. Led directly to 14th Amendment (1868) to embed protections in Constitution.","Continuity – Federal protection of civil rights continued (14th, 15th Amendments, Civil Rights Act of 1875). Change – First civil rights law over presidential veto. Later gutted by Supreme Court (Civil Rights Cases 1883) but revived in 20th century.","Civil Rights Act of 1866 vs. Civil Rights Act of 1964. 1866 defined citizenship; 1964 outlawed discrimination in public accommodations, employment."],
        [113,5,"Andrew Johnson's Impeachment (1868)","President Johnson impeached by House of Representatives (first presidential impeachment) for violating Tenure of Office Act (firing Secretary of War Edwin Stanton without Senate approval). Senate trial fell one vote short of conviction (35‑19); he remained in office.","Johnson's lenient Reconstruction policies clashed with Radical Republicans; Johnson vetoed civil rights bills; deliberately tested Tenure of Office Act.","Johnson politically weakened; Reconstruction continued under Congressional control. Established precedent that impeachment is political, not criminal, process.","Continuity – Impeachment used later (Clinton 1998, Trump 2019, 2021). Change – First presidential impeachment; fell one vote short. Set precedent that removal unlikely without strong bipartisan support.","Johnson's Impeachment vs. Nixon's near‑impeachment (1974). Johnson charged with violating law; Nixon charged with obstruction of justice. Johnson survived; Nixon resigned."],
        [114,5,"Freedmen's Bureau (1865–1872)","Bureau of Refugees, Freedmen, and Abandoned Lands – federal agency providing food, housing, medical care, legal assistance, education to freed people and poor whites. Established over 1,000 schools (Howard University, Fisk University, Morehouse College) and helped reunite families.","Need to assist 4 million enslaved people transitioning from bondage; South's economy and infrastructure destroyed.","Established foundation for Black education in South. Helped negotiate labor contracts (many turned into sharecropping). Operated hospitals, distributed food. Fiercely opposed by white Southerners as federal intrusion. Dismantled 1872 due to lack of funding and political support.","Continuity – Federal aid to education continued (Morrill Act, later GI Bill). Change – Freedmen's Bureau first federal social welfare agency. Represented new level of federal responsibility for individual well‑being. After dismantling, responsibility largely disappeared until New Deal (1930s).","Freedmen's Bureau vs. New Deal programs (1930s). Both federal aid programs. Bureau temporary and underfunded; New Deal programs permanent or long‑lasting. Bureau targeted freed people specifically; New Deal targeted all poor Americans but often excluded agricultural and domestic workers (mostly Black)."],
        [115,5,"Black Codes (1865–1866)","Laws passed by Southern states under President Johnson's lenient Reconstruction restricting freed people's rights. Required yearly labor contracts (harsh penalties for breaking), prohibited owning guns or renting land, vagrancy laws allowing arrest of unemployed Black people forced into labor. Essentially re‑created slavery under another name.","White Southerners wanted to maintain racial control and cheap labor supply. Believed Black people inferior and should not have same rights as whites.","Black Codes outraged Northerners, who saw South trying to restore slavery in all but name. Radical Republicans responded with Civil Rights Act of 1866 (over Johnson's veto) and later 14th Amendment, overriding Black Codes.","Continuity – Slave codes existed before Civil War. Change – Black Codes applied to free people (not enslaved). Used criminal justice system (vagrancy, fines) to coerce labor, laying foundation for convict lease system. Backlash pushed federal government to protect civil rights for first time.","Black Codes vs. Jim Crow laws (post‑1877). Black Codes aimed to control labor and movement immediately after slavery. Jim Crow aimed to segregate public facilities, separate races, disenfranchise Black voters."],
        [116,5,"14th Amendment (1868)","Granted citizenship to 'all persons born or naturalized in the United States' (overruling Dred Scott). Guaranteed 'equal protection of the laws' and 'due process of law' to all citizens. Penalized states denying suffrage by reducing representation (never enforced). Forbade former Confederates from holding office unless pardoned by 2/3 of Congress.","Black Codes outraged Northerners; Civil Rights Act of 1866 seen as vulnerable to constitutional challenge. 14th Amendment embedded equal protection and due process into Constitution.","Provided constitutional basis for virtually all civil rights litigation (Brown v. Board, Roe v. Wade, Obergefell v. Hodges). Made Bill of Rights apply to states (incorporation doctrine through later cases). Supreme Court limited scope early (Slaughter‑House Cases, Plessy v. Ferguson).","Continuity – 14th Amendment still most litigated provision of Constitution. Change – Before 1868, Bill of Rights only limited federal government. After 14th's due process clause, Supreme Court gradually applied most Bill of Rights to states.","14th Amendment vs. Civil Rights Act of 1866. 1866 Act statute (could be repealed); 14th constitutional provision (harder to change). Amendment passed to lock in protections and prevent future Congress from overturning."],
        [117,5,"15th Amendment (1870)","Prohibits federal government and states from denying right to vote 'on account of race, color, or previous condition of servitude.' Did not guarantee vote to women (came 1920). Allowed literacy tests, poll taxes, grandfather clauses – methods later used to disenfranchise Black voters without explicitly mentioning race.","Republicans wanted to protect voting rights of Black men (mostly voted Republican). Feared without federal protection, Southern states would simply disenfranchise Black voters.","During Reconstruction, Black men voted in large numbers, elected hundreds of Black officials (including two U.S. senators), helped write new state constitutions. After Reconstruction ended (1877), Southern states systematically disenfranchised Black voters through poll taxes, literacy tests, violence. Not effectively enforced until Voting Rights Act of 1965.","Continuity – Voting restrictions persisted (women, Natives, later effectively Black Southerners). Change – 15th Amendment first federal constitutional protection of right to vote based on race. Loopholes made evasion easy.","15th Amendment vs. Voting Rights Act of 1965. 15th prohibited racial discrimination in voting; VRA provided federal enforcement mechanisms (federal examiners, pre‑clearance, outlawed literacy tests)."],
        // PERIOD 6 (cards 118-146)
        [118,6,"Sharecropping (1870s–1940s)","System replacing slavery in South. Freed people (and poor whites) farmed land in exchange for share of crop (usually 1/2 to landowner). Landowner provided seed, tools, housing. Sharecroppers bought supplies on credit at inflated prices, paid back at harvest – perpetually in debt. Economic dependency keeping Black Southerners in poverty.","No land redistribution – freed people had no '40 acres and a mule.' Needed work; planters needed labor. Sharecropping emerged as compromise between slavery and free labor market.","Black Southerners remained economically dependent on white landowners. Poverty, illiteracy, poor health persisted generations. Tied families to land, limiting mobility. Collapsed during Great Depression and mechanization of agriculture.","Continuity – Economic dependency persisted after sharecropping (tenant farming, then migration to Northern cities). Change – Sharecropping replaced gang labor of slavery with family‑based labor, but debt peonage often as restrictive.","Sharecropping vs. slavery. In slavery, worker owned property, no wages, subject to physical punishment. In sharecropping, legally free, could marry, theoretically leave. But debt system tied them, violence enforced system."],
        [119,6,"Ku Klux Klan (Reconstruction)","White supremacist terrorist organization founded in Pulaski, Tennessee (1865). Used violence (lynching, whipping, burning) to intimidate Black voters, white Republicans, and anyone supporting Reconstruction. Targeted schools, churches, political leaders. Essentially military arm of Democratic Party in South.","White resentment of Reconstruction – Black voting, Black office‑holders, federal troops, economic empowerment of freed people.","Klan succeeded in suppressing Black voting in many areas. Congress passed Enforcement Acts (1870‑71) authorizing federal troops and prosecutions to crush Klan. Thousands arrested; Klan temporarily collapsed. After 1877, new paramilitary groups (White Leagues, Red Shirts) continued violence, helping 'Redeemers' take over Southern governments.","Continuity – White supremacist violence continued after Reconstruction (lynching more common in 1890s). Change – First Klan suppressed by federal force under Enforcement Acts. Later Klans (1915, 1920s) revived but targeted immigrants, Catholics, Jews as well as Black Americans.","First Klan (Reconstruction) vs. Second Klan (1915‑1920s). First Klan Southern, rural, focused on Black voters and Republicans. Second Klan national (big in Midwest and West), anti‑immigrant, anti‑Catholic, anti‑Jewish, also anti‑Black."],
        [120,6,"Compromise of 1877","Informal, unwritten deal resolving disputed 1876 presidential election. Democrat Samuel Tilden won popular vote but one electoral vote short, with 20 votes disputed in four states. Electoral commission awarded all disputed votes to Republican Rutherford B. Hayes. In exchange, Hayes agreed to withdraw federal troops from South, effectively ending Reconstruction.","Election too close to call; both parties claimed victory. Country weary of Reconstruction; North turning to economic issues (railroads, tariffs, labor unrest).","Reconstruction ended. Federal troops left South. 'Redeemer' governments (white Southern Democrats) took control. Jim Crow laws began, Black voting rights systematically stripped. Compromise also gave Southern Democrats promise of federal funding for internal improvements (railroad).","Continuity – Backroom political deals common in Gilded Age. Change – Compromise abandoned 4 million Black Southerners to nearly century of segregation, disenfranchisement, violence. Marked end of federal protection for civil rights until 1960s.","Compromise of 1877 vs. Missouri Compromise (1820). Both resolved sectional crises; both postponed (or ended) federal action on slavery/civil rights. Missouri bought time before Civil War; Compromise of 1877 bought peace for white Southerners at cost of Black rights."],
        [121,6,"Transcontinental Railroad (Completed 1869)","First railroad connecting Atlantic and Pacific coasts. Union Pacific built westward from Omaha (Irish laborers); Central Pacific built eastward from Sacramento (Chinese laborers). Met at Promontory Summit, Utah, May 10, 1869 – golden spike driven.","Pacific Railway Acts (1862, 1864) provided land grants and loans. Federal government wanted to connect California to rest of Union, promote westward settlement, transport goods and troops.","Created national market – goods moved coast to coast in days instead of months. Destroyed buffalo herds (railroad split herds, hunters killed them for hides and sport). Enabled conquest of Native peoples (railroad brought soldiers and settlers). Led to time zones (1883).","Continuity – Railroads continued to expand (by 1890, over 160,000 miles). Change – Transcontinental railroad first to connect coasts, making U.S. truly continental. Transformed Great Plains from 'Great American Desert' to highway of commerce and settlement.","Transcontinental Railroad vs. Erie Canal (1825). Canal connected Great Lakes to Hudson River; railroad connected Atlantic to Pacific. Canal opened Midwest; railroad opened West. Both government‑funded infrastructure projects."],
        [122,6,"Morrill Land‑Grant Act (1862 & 1890)","Granted each state (that remained in Union) 30,000 acres of public land per member of Congress. Land sold to fund colleges teaching 'agriculture and the mechanic arts.' Led to many state universities (Michigan State, Penn State, Iowa State). Second Morrill Act (1890) required states to admit Black students or provide separate land‑grant colleges (historically Black land‑grant universities like Tuskegee, Alcorn State).","Need for practical education in farming and engineering; absence of federal funding for higher education.","Created system of land‑grant universities, democratizing higher education and promoting agricultural and technical research (Cooperative Extension Service). Expanded college access for middle class.","Continuity – Government support for education (Northwest Ordinance set aside land for schools). Change – Morrill Acts first federal funding for higher education. Shift from private and church‑based colleges to public universities.","Morrill Act vs. GI Bill (1944). Both expanded access to education; Morrill Act created institutions; GI Bill sent veterans to those and other colleges."],
        [123,6,"Gilded Age (1870s‑1900s)","Term coined by Mark Twain and Charles Dudley Warner in 1873 novel The Gilded Age. Era of rapid industrialization, massive economic growth, extreme wealth inequality, political corruption, social conflict. 'Gilded' means covered with thin layer of gold – appeared prosperous but hid deep problems.","Second Industrial Revolution; laissez‑faire capitalism; weak government regulation; waves of immigration and westward expansion.","Rise of trusts and monopolies; labor unrest (Haymarket, Homestead, Pullman); populist and progressive reforms; 'Gospel of Wealth' and Social Darwinism.","Continuity – Industrialization continued, inequality remains perennial issue. Change – Gilded Age first time industrial capitalism dominated U.S. economy. Term itself critique of hollow prosperity.","Gilded Age vs. Progressive Era. Gilded Age: laissez‑faire, weak government, corruption, inequality. Progressive Era: reform, regulation, trust‑busting, consumer protection, conservation."],
        [124,6,"Andrew Carnegie & Vertical Integration","Andrew Carnegie dominated steel industry through vertical integration – controlling every stage from iron ore mines to steel mills to railroads to distribution. Used Bessemer process to mass‑produce steel cheaply. Wrote Gospel of Wealth (1889) arguing rich had moral duty to give fortunes to benefit society.","Demand for steel exploded (railroads, skyscrapers, bridges). Carnegie immigrant from Scotland who rose from poverty.","Carnegie Steel became largest steel company in world. Carnegie became one of richest men in history. Later gave away about $350 million (billions today) to build libraries, universities (Carnegie Mellon), concert halls (Carnegie Hall), peace projects. Vertical integration model copied by other industrialists.","Continuity – Industrial monopolies and trusts appeared everywhere in Gilded Age. Change – Carnegie's vertical integration new business model (control every step). Gospel of Wealth influenced philanthropy generations but also justified huge inequality.","Vertical integration (Carnegie) vs. Horizontal integration (Rockefeller). Vertical: owning all stages of production. Horizontal: buying up all competitors in single stage (Standard Oil controlled 90% of oil refining)."],
        [125,6,"John D. Rockefeller & Horizontal Integration","Rockefeller dominated oil refining through horizontal integration – bought up or drove out competitors, controlling over 90% of U.S. oil refining. Used trusts (stockholders handed shares to board of trustees) to consolidate control. Standard Oil Trust model for corporate monopolies.","Oil industry chaotic – many small refiners competing, leading to price wars and waste. Rockefeller saw efficiency and stability in consolidation.","Standard Oil most famous monopoly of Gilded Age. Drove prices down (efficient) but crushed competition and bribed politicians. Sherman Antitrust Act (1890) passed in response, but initially weak. In 1911, Supreme Court ordered Standard Oil broken into 34 independent companies (Exxon, Mobil, Chevron).","Continuity – Monopolies continued to be problem (AT&T, Microsoft, Google). Change – Rockefeller created first large‑scale, nationwide monopoly. Use of trust structure allowed him to circumvent state laws forbidding out‑of‑state assets.","Horizontal integration vs. Vertical integration. Horizontal eliminates competition; vertical improves efficiency. Both limit competition, but horizontal more directly monopolistic."],
        [126,6,"Gospel of Wealth (Andrew Carnegie, 1889)","Essay arguing wealthy have moral duty to use fortunes for public good through strategic philanthropy (libraries, universities, museums). Rich are 'trustees' for surplus wealth.","Gilded Age inequality; Carnegie's own rise from poverty; religious and moral beliefs.","Inspired generations of philanthropists (Rockefeller, Ford, Gates). Also used to justify wealth inequality (rich earned it; they will give it away). Created model of large‑scale, systematic philanthropy.","Continuity – Wealthy have always given to charity (e.g., Peabody). Change – Gospel of Wealth argued giving should be strategic and done during giver's lifetime, not after death. Shift from haphazard charity to organized philanthropy.","Gospel of Wealth vs. Social Darwinism. Gospel: rich have duty to help poor; Social Darwinism: rich are fittest, no duty to poor. Carnegie believed both – ruthless competitor and generous philanthropist."],
        [127,6,"Social Darwinism (late 19th century)","Applied Darwin's theory of evolution to human society and business. Argued rich were 'fit' and poor 'unfit,' government should not interfere (laissez‑faire). Used to justify wealth inequality, oppose unions, resist regulation, support imperialism.","Darwin's On the Origin of Species (1859) applied to sociology by Herbert Spencer (coined 'survival of the fittest'). Gilded Age industrialists found it convenient.","Used to oppose minimum wage, safety regulations, child labor laws, welfare. Fueled nativism (immigrants might 'dilute' Anglo‑Saxon race) and imperialism (U.S. duty to 'civilize' weaker peoples). Faded after 1890s but influence persisted.","Continuity – Justifications for inequality existed before (divine right, natural law). Change – Social Darwinism used 'science' to justify wealth and power. Earlier justifications religious or philosophical; this claimed to be biological.","Social Darwinism vs. Gospel of Wealth. Both accept wealth inequality inevitable. Social Darwinism says rich have no duty to poor. Gospel says rich have duty to use wealth for public good."],
        [128,6,"Knights of Labor (1869–1886)","One of first national labor unions. Open to all workers: skilled, unskilled, women, African Americans, immigrants (but not Chinese). Goals: 8‑hour day, end child labor, equal pay, worker‑owned cooperatives (socialist). Grew to over 700,000 members.","Gilded Age appalling working conditions, child labor, 80‑hour weeks, no safety regulations. Workers had almost no power against corporations.","Organized successful strikes, especially against railroads (Great Railroad Strike of 1877). After Haymarket Riot (1886) in Chicago, Knights falsely blamed. Public opinion turned against unions; Knights collapsed. Replaced by more conservative American Federation of Labor (AFL).","Continuity – Labor organizing continued (AFL, CIO). Change – Knights broad, inclusive, reform‑oriented seeking to transform society. AFL narrow, skilled‑only, focused on 'bread and butter' issues.","Knights of Labor vs. American Federation of Labor (AFL). Knights: open to all, sought political and economic reform. AFL: skilled workers only, focused on higher wages and shorter hours, avoided radical politics."],
        [129,6,"Haymarket Riot (1886)","Labor protest in Chicago's Haymarket Square May 4, 1886, demanding 8‑hour day. Someone threw bomb at police; police fired into crowd. Seven police and at least four civilians killed (many wounded). Eight anarchist labor leaders convicted; four hanged.","Tensions between labor and police; national 8‑hour day movement (May 1 massive strike); history of labor violence. Bomb thrower never identified; authorities blamed anarchist movement.","Knights of Labor falsely blamed (had no involvement) and collapsed. Public turned against unions – 'labor radicalism' equated with violence and anarchy. May Day became International Workers' Day. Haymarket martyrs heroes to left.","Continuity – Labor violence continued (Homestead, Pullman). Change – Haymarket discredited entire labor movement for years. Led to wave of arrests and repression of anarchist/socialist groups. Created myth of 'dangerous foreign radical' (most convicted immigrants).","Haymarket Riot vs. Pullman Strike (1894). Haymarket small protest turning violent when bomb exploded; blamed on anarchists. Pullman nationwide railroad strike broken by federal troops and injunction using Sherman Antitrust Act."],
        [130,6,"American Federation of Labor (AFL) – founded 1886","National union federation led by Samuel Gompers. Focused only on skilled workers (craft unions). Fought for 'bread and butter' issues: higher wages, shorter hours, better working conditions. Avoided radical politics, preferring collective bargaining and strikes. Most successful and enduring union of Gilded Age.","Collapse of Knights of Labor (blamed for Haymarket Riot). Skilled workers had more bargaining power; wanted practical results, not revolutionary change.","AFL grew to over 1 million members by 1900. Became model for American unionism: pragmatic, non‑revolutionary, focused on immediate gains. Excluded unskilled, women, African Americans (initially). Survived anti‑union backlash of 1890s, became core of New Deal labor movement.","Continuity – Craft unions existed before (molders, cigarmakers). Change – AFL united craft unions into single powerful federation. Set agenda for labor for next 50 years: skilled workers, high dues, political action (but not labor party), acceptance of capitalism.","AFL vs. Industrial Workers of the World (IWW, 1905). AFL: skilled, pragmatic, non‑revolutionary, accepted capitalism. IWW: unskilled, immigrants, women, miners – all workers 'one big union,' revolutionary, more radical tactics."],
        [131,6,"Chinese Exclusion Act (1882)","First federal law banning immigration based on race/nationality. Prohibited Chinese laborers from entering U.S. for 10 years (later extended, permanent until 1943). Also barred Chinese immigrants already in U.S. from naturalizing.","Anti‑Chinese violence (Rock Springs Massacre 1885); fear Chinese workers took jobs from whites; racial prejudice; California politicians (Denis Kearney) whipped up anti‑Chinese sentiment.","Chinese population in U.S. declined sharply. Set precedent for future immigration restrictions (National Origins Act 1924). Repealed 1943 as symbolic gesture during WWII (China ally).","Continuity – Immigration restriction continued (1924 quotas). Change – First time Congress banned entire nationality. Shift from open immigration to race‑based exclusion.","Chinese Exclusion Act vs. National Origins Act (1924). Both restricted by nationality; Chinese Exclusion targeted single group; 1924 set quotas for all nations."],
        [132,6,"Pendleton Act (1883)","Civil Service Reform Act. Created U.S. Civil Service Commission and required some federal jobs filled through competitive exams (merit) rather than political patronage (spoils system). Initially covered about 10% of federal positions.","Assassination of President James Garfield by disappointed office‑seeker (Charles Guiteau). Public outrage over spoils system.","Gradually expanded to cover most federal jobs. Reduced corruption and political favoritism. Marked beginning of professional civil service.","Continuity – Patronage had been norm since Jackson. Change – Pendleton Act introduced merit‑based hiring. Shift from 'to the victor belong the spoils' to professional bureaucracy.","Pendleton Act vs. Jackson's spoils system. Jackson believed in rotation in office (loyalty over competence). Pendleton prioritized competence and exam performance."],
        [133,6,"Interstate Commerce Act (1887)","First federal law to regulate private industry. Created Interstate Commerce Commission (ICC) to oversee railroads. Prohibited discriminatory rates, rebates, pooling. Required railroads to publish rates.","Railroad abuses (price discrimination, rebates to big shippers); Supreme Court's Wabash Case (1886) struck down state railroad regulations; farmers and small businesses demanded federal action.","Set precedent for federal regulatory agencies (FTC, FCC, SEC). ICC initially weak but gained power over time. Marked shift from laissez‑faire to federal oversight.","Continuity – Federal agencies continued to be created (FDA, FTC, EPA). Change – ICA first time Congress used commerce power to regulate industry directly.","Interstate Commerce Act vs. Sherman Antitrust Act (1890). ICA targeted railroads specifically; Sherman Act targeted monopolies generally. ICA created regulatory agency; Sherman Act relied on courts."],
        [134,6,"Sherman Antitrust Act (1890)","First federal law to outlaw monopolies and trusts restraining trade. Prohibited 'every contract, combination… or conspiracy in restraint of trade.' Vague language allowed courts to narrow it.","Public anger at monopolies (Standard Oil, sugar trust, railroad trusts); Gilded Age distrust of big corporations; Populist and Progressive demands.","Initially weak and used more against labor unions (Pullman Strike 1894) than trusts. After 1911, used to break up Standard Oil and American Tobacco. Set foundation for later antitrust (Clayton Act, FTC).","Continuity – Antitrust enforcement continues (Microsoft, AT&T, Google). Change – Sherman Act's vagueness allowed courts to limit it. Shift from weak to stronger enforcement after Progressive Era.","Sherman Act vs. Clayton Act (1914). Sherman general and vague; Clayton specific (prohibited price discrimination, interlocking directorates, exempted unions)."],
        [135,6,"Dawes Act (1887)","Broke tribal lands into individual plots (160 acres per family). Land held in trust for 25 years, after which Native owner would receive full title and U.S. citizenship. 'Surplus' land sold to white settlers.","Desire to 'civilize' Native Americans by forcing private property, farming, U.S. citizenship. White settlers and railroads wanted access to reservation lands.","Native Americans lost about 90 million acres (2/3 remaining land). Communal tribal structures destroyed. Poverty and cultural disruption increased. Considered one of most destructive federal policies toward Native peoples. Reversed by Indian Reorganization Act of 1934.","Continuity – Assimilation policy before (boarding schools, bans on languages/religions). Change – Dawes Act used private property as weapon. Assumed if Natives owned land individually, they would adopt farming and become 'civilized.' Land often unsuitable; surplus stolen.","Dawes Act vs. Indian Removal Act (1830). Removal forced tribes to move west; Dawes stripped them of land even there. Removal about relocating Natives out of way; Dawes about destroying tribal identity."],
        [136,6,"Wounded Knee Massacre (1890)","Last major armed conflict of Indian Wars. U.S. Army troops (7th Cavalry, Custer's old regiment) surrounded Lakota Sioux (mostly women, children, elderly) at Wounded Knee Creek, South Dakota. Shot fired (unknown who); soldiers opened fire with cannons and rifles. About 300 Lakota killed (many women/children); 25 soldiers died (many from friendly fire). At least 20 soldiers received Medal of Honor.","Ghost Dance movement – religious revival promising return of buffalo, disappearance of whites, resurrection of ancestors. Army officials feared uprising and tried to disarm Lakota.","Indian Wars ended. Frontier officially declared 'closed' by 1890 census. Wounded Knee became symbol of brutality of westward expansion and betrayal of Native peoples.","Continuity – Other massacres occurred (Sand Creek, 1864). Change – Wounded Knee last major confrontation; after it, Native resistance crushed. 'Frontier' closed; U.S. turned attention overseas (Spanish‑American War, 1898).","Wounded Knee vs. Sand Creek (1864). Both massacres of peaceful Natives; Sand Creek militia; Wounded Knee U.S. Army."],
        [137,6,"Booker T. Washington (c. 1881–1915)","Educator, author, leading Black leader. Founded Tuskegee Institute (Alabama). Advocated accommodation and economic self‑help. 'Atlanta Compromise' speech (1895): urged Black Americans to accept segregation temporarily in exchange for vocational training and economic opportunity.","Jim Crow; lynchings; disenfranchisement; Washington believed political equality would follow economic progress.","Became most powerful Black leader of his era (advised presidents, controlled patronage). Criticized by W.E.B. Du Bois for accepting segregation. His philosophy shaped Black education for decades.","Continuity – Black leaders debated strategy (accommodation vs. agitation). Change – Washington's influence peaked early 1900s; NAACP and Du Bois challenged his approach after 1909. Shift to demands for immediate civil rights.","Washington vs. Du Bois. Washington: accommodation, vocational education, economic self‑help; Du Bois: immediate political equality, liberal arts education (Talented Tenth), agitation."],
        [138,6,"W.E.B. Du Bois (1868–1963)","Civil rights activist, sociologist, historian, co‑founder of NAACP (1909). First Black Ph.D. from Harvard. Wrote The Souls of Black Folk (1903) criticizing Washington. Advocated immediate political equality, higher education for Black elites (Talented Tenth).","Jim Crow; lynchings; Washington's dominance; Du Bois saw accommodation as surrender.","Helped launch Niagara Movement (1905) and NAACP; edited The Crisis; organized for anti‑lynching and equal rights. Later moved to Ghana, became socialist.","Continuity – Black intellectual activism continued (King, Malcolm X). Change – Du Bois pioneered sociological study of race (Philadelphia Negro) and used data to challenge racism.","Du Bois vs. Washington. Also Du Bois vs. Marcus Garvey. Du Bois integrationist; Garvey separatist."],
        [139,6,"Ida B. Wells (1862–1931)","Journalist, anti‑lynching crusader, civil rights activist. Documented lynchings in pamphlets (Southern Horrors, The Red Record). Co‑founder of NAACP. Also fought for women's suffrage.","Three friends lynched in Memphis (1892); Wells owned newspaper 'Free Speech' and publicized lynchings.","Exposed lynching as racial terrorism (not punishment for crime). Forced national debate. Laid foundation for anti‑lynching legislation (never passed in her lifetime, but raised awareness).","Continuity – Muckrakers later used similar investigative methods. Change – Wells was Black woman doing investigative journalism in Jim Crow South.","Ida B. Wells vs. Booker T. Washington. Wells challenged white supremacy directly with data; Washington accommodated."],
        [140,6,"NAACP (National Association for the Advancement of Colored People) – founded 1909","Civil rights organization founded by multiracial group including Du Bois, Ida B. Wells, Jane Addams, Oswald Garrison Villard. Used legal challenges, lobbying, grassroots activism to fight segregation and discrimination.","Race riots (Springfield 1908); failure of Washington's accommodation; need for national civil rights organization.","Led legal campaign culminating in Brown v. Board (1954); lobbied for anti‑lynching laws; became leading civil rights group of 20th century.","Continuity – Earlier civil rights groups existed (Niagara Movement, National Equal Rights League). Change – NAACP interracial, national, focused on legal strategy. Still active today.","NAACP vs. Southern Christian Leadership Conference (SCLC, 1957). NAACP focused on courts and legislation; SCLC on nonviolent direct action."],
        [141,6,"Homestead Strike (1892)","Violent strike at Carnegie Steel plant in Homestead, Pennsylvania. Plant manager Henry Frick cut wages. Union (Amalgamated Iron and Steel Workers) refused. Frick locked out workers and hired 300 Pinkerton detectives. Workers fought back with guns, killing 7 Pinkertons; state militia called in; union crushed. Frick survived assassination attempt by anarchist Alexander Berkman.","Wage cuts; union's refusal; Frick's determination to break union; Gilded Age pattern of corporations using private police and state to crush labor.","Union at Homestead destroyed; steel unionization set back decades. Carnegie (publicly supported unions) revealed as hypocritical (on vacation while Frick did dirty work). Strike showed workers would fight, but government would always side with corporations.","Continuity – Strikebreaking with Pinkertons and state militia common (Great Railroad Strike 1877, Pullman 1894). Change – Homestead most violent of early 1890s and most famous. Permanently damaged Carnegie's reputation.","Homestead Strike vs. Pullman Strike (1894). Homestead single plant; Pullman nationwide railroad strike. Homestead used Pinkertons and state militia; Pullman used federal troops and court injunction."],
        [142,6,"Populist Party (People's Party) – 1892","Third party formed by farmers (Grange, Farmers' Alliances) and industrial workers. Omaha Platform (1892) demanded: direct election of senators (17th Amendment, 1913); unlimited coinage of silver; graduated income tax (16th Amendment, 1913); government ownership of railroads, telegraph, telephone; 8‑hour day; secret ballot; restrictions on immigration.","Falling crop prices; railroad monopolies charging high freight rates; high interest rates; gold standard (kept prices low, benefiting creditors, hurting debtors). Farmers in perpetual debt.","Populist Party won several state elections, strong showing 1892 (over 1 million votes). In 1896, supported Democrat William Jennings Bryan ('Cross of Gold') but lost to McKinley. Party dissolved after 1896, but many reforms passed in Progressive Era.","Continuity – Farmer activism continued (Grange, Farmers' Alliances). Change – Populists created national political party (not just movement). Most successful third party of 19th century; platform anticipated Progressive reforms.","Populist Party vs. Progressive Party (1912, 'Bull Moose'). Populists from farmers/laborers; Progressives from urban middle class. Populists focused on monetary policy (silver) and railroad ownership; Progressives on trust‑busting, conservation, consumer protection."],
        [143,6,"Pullman Strike (1894)","Nationwide railroad strike led by American Railway Union (ARU) and president Eugene V. Debs. Pullman Palace Car Company cut wages but refused to cut rents in company town. ARU declared boycott of Pullman cars, crippling rail traffic. Federal troops sent by President Grover Cleveland over objection of Illinois Governor. Federal court issued injunction using Sherman Antitrust Act. Debs arrested; strike collapsed.","Wage cuts without rent reduction; power of ARU (Debs); refusal of railroad companies to negotiate.","Debs imprisoned (later embraced socialism, ran for president five times). Sherman Antitrust Act – intended to break monopolies – used for first time to crush labor union. Strike showed federal government would use full power to protect railroads and commerce, not workers.","Continuity – Government siding with corporations (Homestead, Great Railroad Strike). Change – Pullman first use of Sherman Act (1890) against union. Set dangerous precedent until Clayton Act (1914) exempted unions.","Pullman Strike vs. Homestead Strike (1892). Homestead single plant; Pullman nationwide. Homestead used Pinkertons and state militia; Pullman used federal troops and federal injunction."],
        [144,6,"Social Gospel (late 19th – early 20th century)","Protestant Christian movement applying Christian ethics to social problems – poverty, slums, child labor, unsafe factories, racial injustice. Argued Christians had duty to reform society, not just save individual souls. Leaders: Washington Gladden, Walter Rauschenbusch. Led to settlement houses (Jane Addams' Hull House), YMCA, Salvation Army, many Progressive reforms.","Industrial poverty, squalid urban conditions, gap between rich and poor. Reaction to Social Darwinism (poor deserved fate). Legacy of Second Great Awakening (reform as religious duty).","Inspired settlement house movement, child labor laws, factory inspections, 'city reform' movement. Social Gospel ministers pushed temperance, Sabbath laws, anti‑prostitution campaigns. Laid ideological groundwork for New Deal and later civil rights activism (MLK was Social Gospel minister).","Continuity – Religious reform movements existed before (abolitionism, temperance). Change – Social Gospel focused on structural causes of poverty (capitalism, industrialization), not just individual sin. Shifted from personal salvation to social salvation.","Social Gospel vs. Second Great Awakening. Second Great Awakening emphasized individual conversion and moral reform (temperance, abolition); Social Gospel emphasized systemic change (poverty, labor rights, urban reform)."],
        [145,6,"'New South' (Henry Grady, 1880s)","Phrase popularized by Henry Grady, editor of Atlanta Constitution, urging South to industrialize, modernize, diversify away from cotton monoculture and slavery‑based agriculture. Envisioned South of factories, railroads, cities, where whites and Blacks would work (but remain segregated). 'New South' to leave behind 'Lost Cause' myth and embrace future.","Devastation of Civil War; failure of Reconstruction; need for economic growth; desire to attract Northern capital.","Limited industrialization (textile mills, tobacco processing, steel mills in Birmingham). Most of South remained agricultural and poor. 'New South' largely preserved white supremacy and sharecropping. Began long transition accelerating after WWII.","Continuity – South remained poorest region, still predominantly agricultural and segregated. Change – Some industrialization occurred; 'New South' rhetoric shifted public discourse toward modernization.","'New South' vs. 'Old South.' Old South plantation‑based, slave labor, agrarian, isolationist. New South claimed industrial, diversified, integrated into national economy."],
        [146,6,"Plessy v. Ferguson (1896)","Supreme Court upheld racial segregation under 'separate but equal' doctrine. Homer Plessy (1/8 Black, appeared white) sat in whites‑only railroad car in Louisiana, arrested for violating state segregation law. Court (7‑1) ruled segregation constitutional as long as facilities were equal.","Jim Crow laws spreading across South. Plessy deliberately challenged law. Court's majority argued segregation did not imply inferiority of Black people (even though everyone knew it did).","'Separate but equal' became law of land for over 50 years. Legalized segregation in schools, transportation, public accommodations, housing. Not overturned until Brown v. Board (1954). Separate never equal; Black facilities always inferior.","Continuity – Segregation existed before Plessy (de facto in North, de jure in South after Reconstruction). Change – Plessy gave segregation full force of Supreme Court approval. Made it much harder to challenge Jim Crow. Lone dissenter Justice Harlan wrote: 'Our Constitution is color‑blind.'","Plessy v. Ferguson vs. Brown v. Board (1954). Plessy said separate but equal constitutional; Brown said separate inherently unequal."]

<script>
    // ---------- PART 6: PERIODS 7 & 8 (cards 147–259) ----------
    window.cardsData.push(
        // PERIOD 7 (cards 147-191)
        [147,7,"Spanish‑American War (1898)","Brief war between U.S. and Spain, fought mainly in Cuba and Philippines. U.S. won easily. Treaty of Paris (1898) gave U.S. Guam, Puerto Rico, Philippines ($20 million). Cuba granted independence, but Platt Amendment (1901) gave U.S. right to intervene and lease Guantanamo Bay.","Cuban independence struggle; yellow journalism; sinking of USS Maine (Feb 15, 1898); 'Remember the Maine!'; De Lôme Letter insulting McKinley.","U.S. emerged as world power with overseas empire. Philippine‑American War (1899-1902) crushed Filipino independence. Imperialism debate split nation (Anti‑Imperialist League: Carnegie, Twain, Gompers). Rise of Theodore Roosevelt (Rough Riders).","Continuity – U.S. expansion continued (Manifest Destiny). Change – Spanish‑American War gave overseas colonies (non‑contiguous). Shift from continental expansion to overseas imperialism.","Spanish‑American War vs. Mexican‑American War (1846-48). Mexican War added North American land; Spanish War added islands in Caribbean and Pacific."],
        [148,7,"Open Door Policy (1899)","Diplomatic notes from Secretary John Hay to major powers (Britain, Germany, France, Italy, Russia, Japan) proposing equal trading rights in China and preservation of China's territorial integrity.","Scramble for concessions – European powers and Japan carving China into exclusive spheres; U.S. feared being shut out of Chinese market.","Powers accepted Open Door reluctantly. Basis of U.S.-China relations for decades. Contributed to Boxer Rebellion (1900); U.S. joined multinational force crushing Boxers.","Continuity – U.S. sought access to Asian markets since 19th century (Commodore Perry). Change – Open Door was formal diplomatic policy, asserted interests without military force.","Open Door Policy vs. Monroe Doctrine (1823). Monroe warned Europe out of Western Hemisphere; Open Door asked Europe to keep China open. Both asserted U.S. interests without initial enforcement."],
        [149,7,"Platt Amendment (1901)","Amendment attached to army appropriations bill specifying conditions for withdrawal of U.S. troops from Cuba. Added to Cuban constitution. Conditions: Cuba couldn't make treaties impairing independence; allowed U.S. intervention 'for preservation of Cuban independence'; leased naval stations (Guantanamo Bay).","U.S. wanted to control Cuba without annexing it (Teller Amendment promised independence). Concerned about instability and wanted naval base.","Cuba became U.S. protectorate, not truly independent. U.S. intervened repeatedly (1906-09, 1912, 1917-22). Platt Amendment repealed 1934 (Good Neighbor Policy). Guantanamo Bay remains U.S. base.","Continuity – U.S. claimed right to intervene in Western Hemisphere (Roosevelt Corollary). Change – Platt Amendment first explicit legal basis for U.S. intervention in sovereign nation. Made Cuba de facto colony.","Platt Amendment vs. Roosevelt Corollary (1904). Platt applied specifically to Cuba; Roosevelt Corollary claimed right to intervene in any Latin American nation."],
        [150,7,"Theodore Roosevelt's 'Square Deal' (1901–1909)","Roosevelt's domestic program – 'Three C's': Control of corporations (trust‑busting: broke up Northern Securities Co., over 40 trusts), Consumer protection (Pure Food and Drug Act and Meat Inspection Act, 1906), Conservation (U.S. Forest Service, added 230 million acres to public lands). Used 'bully pulpit' to lead public opinion.","Progressive reform pressure; Gilded Age abuses (monopolies, unsafe food, deforestation).","Strengthened federal regulation of business and resources. Set precedents for active presidency and conservation. Inspired later environmental and consumer movements.","Continuity – Antitrust existed (Sherman Act, 1890). Change – Roosevelt actively used it, distinguishing 'good' vs. 'bad' trusts. Conservation was new at this scale.","Square Deal vs. Wilson's New Freedom (1913-1917). Roosevelt would regulate trusts; Wilson wanted to break them up and restore competition."],
        [151,7,"Muckrakers (1900s–1910s)","Investigative journalists exposing corruption, unsanitary conditions, social inequities. Key works: Ida Tarbell (Standard Oil), Upton Sinclair (The Jungle → Pure Food and Drug and Meat Inspection Acts), Jacob Riis (How the Other Half Lives), Lincoln Steffens (The Shame of the Cities).","Industrial abuses, urban poverty, public appetite for reform, rise of mass‑circulation magazines.","Spurred Progressive legislation (Pure Food and Drug Act, Meat Inspection Act, antitrust enforcement). Reshaped public awareness. Term 'muckraker' coined by Roosevelt.","Continuity – Exposés existed before (abolitionist press). Change – Muckrakers reached millions, used photo journalism, directly drove legislative change. Professionalized investigative journalism.","Muckrakers vs. Watergate journalists (1970s). Both exposed corruption; muckrakers focused on industries and cities; Watergate on presidency."],
        [152,7,"16th Amendment (1913)","Granted Congress power to levy graduated (progressive) income tax without apportioning among states by population.","Revenue needs after tariff reductions; Populist/Progressive demand to tax wealthy; Supreme Court struck down 1894 income tax (Pollock v. Farmers' Loan & Trust).","Created modern federal revenue system (income tax now ~50% of federal revenue). Enabled redistributive policies (welfare state). One of most consequential amendments.","Continuity – Income tax existed during Civil War (temporary). Change – 16th made it permanent and constitutional. Shift from tariffs to income tax as primary revenue source.","16th Amendment vs. Populist Party platform. Populists demanded graduated income tax; took until 1913 to get one."],
        [153,7,"17th Amendment (1913)","Provided for direct election of U.S. senators by popular vote, replacing selection by state legislatures.","Populist/Progressive demand to reduce corruption (state legislatures deadlocked, bribed, or left seats empty). Some states already had primary elections.","Senators became more accountable to voters; reduced legislative corruption. Shifted power from state legislatures to people.","Continuity – House had always been directly elected. Change – Before 1913, senators chosen by state legislatures as political favors. Direct election major democratic reform.","17th Amendment vs. original Constitutional design. Original: senators represented state governments (check on federal power). 17th made them representatives of people."],
        [154,7,"Federal Reserve Act (1913)","Created Federal Reserve System ('Fed') – central bank with 12 regional banks, Federal Reserve Board (appointed), ability to set interest rates, control money supply, perform open market operations, act as lender of last resort.","Financial panics (Panic of 1907); need for flexible currency and central control.","Stabilized banking system; reduced bank failures. Still exists as nation's central bank, managing monetary policy, inflation, employment.","Continuity – Central banking existed (First and Second Banks of U.S.). Change – Fed decentralized (12 regional banks) with broader powers (open market operations, discount rate). Survived unlike earlier banks.","Federal Reserve vs. Second Bank of U.S. (BUS). BUS single bank, privately owned, killed by Jackson. Fed decentralized public‑private hybrid with controls."],
        [155,7,"Clayton Antitrust Act (1914)","Strengthened Sherman Antitrust Act. Prohibited price discrimination, tying contracts, interlocking directorates, anti‑competitive mergers. Exempted labor unions from antitrust prosecution (labor not a commodity), legalizing peaceful strikes, boycotts, picketing.","Weakness of Sherman Act (used against unions, not monopolies). Progressive demand for stronger antitrust and labor protections.","Unions protected from antitrust suits (overriding Pullman precedent). FTC created (1914). Gave more teeth to trust‑busting.","Continuity – Antitrust enforcement continued. Change – Explicit labor exemption landmark; unions could organize without fear of Sherman Act. Clayton Act called 'Magna Carta of labor.'","Clayton Act vs. Sherman Act (1890). Sherman vague, used often against unions; Clayton specific, exempts unions, forbids specific practices."],
        [156,7,"Federal Trade Commission (FTC) – 1914","Independent agency created to enforce antitrust laws and protect consumers from unfair business practices. Investigates and stops deceptive advertising, monopolistic behavior.","Weakness of Sherman Act; need for expert agency to monitor business practices (not just courts).","Works alongside Clayton Act to prevent unfair competition. Still active (regulates advertising, privacy).","Continuity – Regulatory agencies (ICC precedent). Change – FTC proactive (investigates) rather than reactive (courts). Shift from litigation to regulation.","FTC vs. ICC. ICC regulated specific industry (railroads); FTC regulates unfair practices across all industries."],
        [157,7,"Keating‑Owen Act (1916)","First federal law banning child labor (manufactured goods). Prohibited interstate commerce of products made by children under 14, and those 14‑16 working >8 hours/day or nights. Struck down by Supreme Court in Hammer v. Dagenhart (1918) as exceeding Congress's commerce power.","Progressive concern over child exploitation; muckraker photos and reports.","Child labor continued until Fair Labor Standards Act (1938). Showed limits of federal power before New Deal. Court reversed course in Darby Lumber (1941), upholding FLSA.","Continuity – States had child labor laws (weak). Change – First federal attempt, struck down. Shift to federal regulation after Court changed interpretation of commerce power.","Keating‑Owen vs. Fair Labor Standards Act (1938). Keating‑Owen struck down; FLSA upheld on same clause after Court's changed jurisprudence."],
        [158,7,"Lusitania (1915)","British passenger liner sunk off Ireland by German U‑boat; 1,198 died (128 Americans). Ship carried munitions (contraband), but Germany had not warned.","German unrestricted submarine warfare; U.S. neutrality. Germany declared waters around Britain war zone.","Shifted American public opinion against Germany. Wilson protested; Germany suspended unrestricted submarine warfare ('Arabic pledge'). Lusitania key step toward U.S. entry into WWI.","Continuity – Neutral rights violations occurred before (impressment, War of 1812). Change – Sinking of civilian passenger ship with Americans caused outrage; modern media amplified horror.","Lusitania vs. USS Maine (1898). Both ship sinkings stirring outrage; Maine (likely accident) led to Spanish‑American War; Lusitania led to WWI entry."],
        [159,7,"Zimmermann Telegram (1917)","Secret telegram from German Foreign Secretary Zimmermann to German ambassador in Mexico, intercepted by British intelligence. Proposed Mexico join Germany if U.S. entered war; Mexico would get back Texas, New Mexico, Arizona (lost in Mexican‑American War).","German desperation to keep U.S. neutral; unrestricted submarine warfare resumed Feb 1, 1917. Telegram sent January 1917.","Outraged American public. Contributed directly to Wilson's request for declaration of war (April 2, 1917; passed April 6). One of most famous espionage coups.","Continuity – Foreign provocations preceded U.S. war entries. Change – Zimmermann Telegram explicit offer to return U.S. territory to Mexico; intercepted and published, inflaming opinion.","Zimmermann Telegram vs. De Lôme Letter (1898). De Lôme Letter insulted McKinley; Zimmermann threatened U.S. territory. Both intercepted and used to whip up war sentiment."],
        [160,7,"U.S. Entry into WWI (1917)","Congress declared war on Germany April 6, 1917. Wilson re‑elected 1916 on 'He kept us out of war.' Proximate causes: resumption of unrestricted submarine warfare (Feb 1917) and Zimmermann Telegram.","Unrestricted submarine warfare; Zimmermann Telegram; Russian Revolution (March 1917) made war 'democracy vs. autocracy.' Wilson's idealism.","U.S. tipped balance to Allies. Massive influx of fresh troops and war materiel broke stalemate. U.S. emerged as world power and played leading role in peace negotiations (Fourteen Points). Senate rejected Treaty of Versailles and League of Nations.","Continuity – U.S. entered European wars before (War of 1812). Change – WWI entry marked permanent shift from isolationism to global involvement (though isolationism returned 1920s-30s). Wilson's vision of collective security failed in his time but laid groundwork for UN.","U.S. entry into WWI vs. entry into WWII (1941). WWI entry provoked by submarine warfare and telegram; WWII by Pearl Harbor. WWI led to brief 'return to normalcy'; WWII led to permanent U.S. global leadership."],
        [161,7,"Great Migration (1915–1970)","Mass movement of about 6 million African Americans from rural South to industrial cities in North, Midwest, West. Main destinations: New York, Chicago, Detroit, Philadelphia, Cleveland, Los Angeles.","Push: Jim Crow, racial violence (lynchings), sharecropping debt, low wages. Pull: industrial jobs (wartime production), higher wages, some freedom.","Harlem Renaissance; race riots (Chicago 1919, Tulsa 1921); changed urban demographics; spread of Black culture (jazz, blues) nationwide; laid demographic foundation for Civil Rights Movement (Black voters in North became political force).","Continuity – Black migration before (Exodusters, 1879). Change – Great Migration massive (6 million). Permanently shifted Black population from rural South to urban North/West. Transformed American music, politics, culture.","Great Migration vs. European immigration. Both moved to industrial cities; European from abroad; Black from American South. Both faced discrimination; Black faced Jim Crow in South and de facto segregation in North; Europeans often assimilated into 'whiteness.'"],
        [162,7,"Fourteen Points & Treaty of Versailles (1919)","Wilson's January 1918 postwar plan: self‑determination, freedom of seas, free trade, open diplomacy, reduction of arms, League of Nations (14th point). Actual Treaty of Versailles (June 1919) harsh: Germany accepted 'war guilt' (Article 231), massive reparations, surrendered territory. Wilson compromised on many points to get League, but Senate rejected treaty.","Wilson's idealism; Allied need for peace settlement; Europe's desire to punish Germany.","Germany humiliated, leading to economic collapse and Nazi rise (WWII). U.S. Senate rejected treaty, so U.S. never joined League. Isolationism for two decades.","Continuity – Post‑war treaties existed before. Change – U.S. Senate rejection unprecedented; U.S. turned inward after leading war. League failed partly due to U.S. absence.","Fourteen Points vs. Treaty of Versailles. Wilson's points idealistic and lenient; Versailles punitive and nationalist. Wilson sacrificed points for League, then lost League."],
        [163,7,"Red Scare & Palmer Raids (1919–1920)","Fear of communist and anarchist revolution after Bolshevik Revolution (1917) and anarchist bombings (including attempt on Attorney General Palmer's home). Palmer launched raids arresting over 6,000 suspected radicals without warrants, held without charges. Hundreds deported (Emma Goldman). Civil liberties flagrantly violated.","Fear of communism spreading to U.S.; labor strikes (1919); immigrant radicalism.","Heightened anti‑immigrant sentiment; contributed to 1924 immigration quotas. Raids widely criticized by legal scholars and discredited. Red Scare faded by 1920.","Continuity – Fear of foreign radicals before (Alien and Sedition Acts, 1798). Change – Palmer Raids most massive peacetime suppression of dissent to that date. Set precedent for second Red Scare (McCarthyism, 1950s).","First Red Scare vs. Second Red Scare. First targeted anarchists/immigrants, used mass arrests/deportations; second targeted communists/government employees, used investigations/blacklists/hearings."],
        [164,7,"Espionage Act (1917) & Sedition Act (1918)","WWI laws: Espionage Act banned interfering with military operations, supporting enemies, causing insubordination. Sedition Act (1918) extended to prohibit 'disloyal, profane, scurrilous, or abusive language' about government, Constitution, flag.","Anti‑war protests; government fear of sabotage and decreased enlistment.","Over 1,500 prosecuted (Eugene Debs sentenced to 10 years). Led to Schenck v. U.S. (1919) establishing 'clear and present danger' test. Provisions still exist.","Continuity – Wartime suppression of dissent (Alien and Sedition Acts 1798). Change – Acts broader, used against socialists and labor leaders. Shift from targeting immigrants to targeting political speech.","WWI Sedition Act vs. Alien and Sedition Acts (1798). Both criminalized criticism of government; 1798 targeted Democratic‑Republicans; 1918 targeted socialists/anti‑war activists."],
        [165,7,"Schenck v. United States (1919)","Supreme Court: Charles Schenck (socialist) distributed anti‑draft leaflets. Convicted under Espionage Act. Court (unanimous) upheld conviction, establishing 'clear and present danger' test for free speech. Holmes: falsely shouting 'fire' in theater not protected.","WWI draft resistance; government prosecution of anti‑war speech.","First time Court articulated limits on free speech. Later refined (Brandenburg v. Ohio 1969: 'imminent lawless action'). Schenck partly overruled, but 'clear and present danger' remains framework.","Continuity – Courts continued balancing free speech and national security. Change – Schenck allowed speech restrictions, but later cases made it harder to punish inflammatory speech.","Schenck vs. Brandenburg (1969). Schenck allowed punishment for speech posing 'clear and present danger'; Brandenburg protected speech unless inciting 'imminent lawless action.'"],
